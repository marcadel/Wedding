<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nancy & Marc — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#332C40;
    --forest:#4B3F5E;
    --forest-2:#6B5A82;
    --ivory:#EBE5D9;
    --ivory-2:#DDD5C4;
    --gold:#9E83B8;
    --gold-light:#CCBBDB;
    --burgundy:#5C6B5E;
    --cream:#F7F4EC;
    --line: rgba(158,131,184,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    font-size:16px;
  }
  .label{
    font-family:'Jost', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11px;
    font-weight:500;
    color:var(--gold);
  }

  /* ---------- GATE ---------- */
  #gate{
    position:fixed; inset:0;
    background:linear-gradient(160deg, var(--ink) 0%, var(--forest) 55%, var(--forest-2) 100%);
    display:flex; align-items:center; justify-content:center;
    z-index:10;
  }
  #gate.hidden{display:none;}
  .gate-box{
    text-align:center;
    color:var(--cream);
    padding:20px;
  }
  .gate-box h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:34px;
    margin:0 0 6px;
  }
  .gate-box p{color:var(--ivory-2); margin:0 0 22px; font-size:14px;}
  .gate-box input{
    background:transparent;
    border:1px solid rgba(251,246,234,0.35);
    color:var(--cream);
    padding:12px 16px;
    font-family:'Jost',sans-serif;
    font-size:15px;
    text-align:center;
    letter-spacing:0.1em;
    width:220px;
  }
  .gate-box button{
    display:block;
    margin:16px auto 0;
    background:var(--gold);
    border:none;
    color:var(--ink);
    padding:12px 30px;
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .gate-error{color:#e2a3a3; font-size:13px; margin-top:12px; font-family:'Jost',sans-serif; min-height:16px;}

  /* ---------- LAYOUT ---------- */
  #dashboard{display:none; max-width:1080px; margin:0 auto; padding:36px 20px 80px;}
  #dashboard.show{display:block;}
  header.top{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px; flex-wrap:wrap; gap:12px;
  }
  header.top h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600; font-size:32px; margin:0; color:var(--forest);
  }
  .dash-divider{
    display:flex; align-items:center; gap:10px;
    margin:0 0 34px; color:var(--gold);
  }
  .dash-divider::before, .dash-divider::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    opacity:0.6;
  }
  .dash-divider::before{ background:linear-gradient(90deg, var(--gold), transparent); }
  .dash-divider::after{ background:linear-gradient(90deg, transparent, var(--gold)); }
  .dash-divider svg{ flex:none; display:block; width:12px; height:12px; }
  .refresh-btn{
    background:none; border:1px solid var(--gold); color:var(--gold);
    padding:8px 16px; font-family:'Jost',sans-serif; font-size:12px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .refresh-btn:hover{background:var(--gold); color:var(--cream);}

  /* stats */
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:14px; margin-bottom:40px;
  }
  .stat-card{
    display:flex; align-items:center; gap:12px;
    background:var(--cream); border:1px solid var(--line);
    padding:18px 20px; text-align:left;
    box-shadow:0 10px 26px -18px rgba(51,44,64,0.45);
  }
  .stat-icon{
    flex:none; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(158,131,184,0.16); color:var(--forest-2);
  }
  .stat-icon svg{ width:17px; height:17px; }
  .stat-card b{
    display:block; font-family:'Cormorant Garamond', serif;
    font-size:30px; color:var(--forest); font-weight:600; line-height:1.1;
  }

  /* section heads */
  h2.section-head{
    display:flex; align-items:center; gap:8px;
    font-family:'Cormorant Garamond', serif; font-weight:600;
    font-size:24px; color:var(--forest); margin:0 0 16px;
    border-bottom:1px solid var(--line); padding-bottom:10px;
  }
  h2.section-head svg{ width:18px; height:18px; flex:none; color:var(--gold); }

  /* guests-seated chart */
  .chart-section{
    background:var(--cream); border:1px solid var(--line);
    padding:18px 20px 20px; margin-bottom:44px;
  }
  .chart-bar{
    display:flex; gap:2px; width:100%; height:20px;
    border-radius:10px; overflow:hidden;
    background:var(--ivory); border:1px solid var(--line);
  }
  .chart-seg{ height:100%; }
  .chart-seg.seated   { background:#6E4FA0; }
  .chart-seg.awaiting { background:#BF7A2A; }
  .chart-seg.declined { background:#A83A3A; }
  .chart-legend{ display:flex; gap:20px; flex-wrap:wrap; margin-top:12px; font-size:13.5px; font-family:'Jost',sans-serif; }
  .chart-legend-item{ display:flex; align-items:center; gap:7px; }
  .chart-legend-dot{ width:10px; height:10px; border-radius:3px; flex:none; }
  .chart-legend-item b{ font-weight:600; color:var(--forest); }
  .chart-legend-item.seated   .chart-legend-dot { background:#6E4FA0; }
  .chart-legend-item.awaiting .chart-legend-dot { background:#BF7A2A; }
  .chart-legend-item.declined .chart-legend-dot { background:#A83A3A; }

  /* seating chart */
  .seating-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:14px; margin-bottom:48px;
  }
  .table-card{
    background:var(--cream); border:1px solid var(--line); padding:16px;
  }
  .table-card .t-num{
    font-family:'Cormorant Garamond', serif; font-size:20px; font-weight:600;
    color:var(--gold); margin-bottom:8px;
  }
  .table-card ul{margin:0; padding-left:18px; font-size:14px;}
  .unassigned-card{border-color:#c98a8a;}
  .unassigned-card .t-num{color:#b0645f;}

  /* guest table */
  .search-row{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .search-row input{
    width:100%; max-width:320px;
    padding:10px 14px; font-family:'EB Garamond',serif; font-size:15px;
    border:1px solid var(--line); background:var(--cream);
  }
  .search-count{ font-family:'Jost',sans-serif; font-size:12px; color:#7a7268; }
  .table-scroll{
    max-height:52vh; overflow-y:auto; overflow-x:auto;
    border:1px solid var(--line);
  }
  table.guest-table{width:100%; border-collapse:collapse; font-family:'Jost',sans-serif; font-size:13.5px; background:var(--cream);}
  table.guest-table thead th{
    position:sticky; top:0; z-index:1;
    text-align:left; text-transform:uppercase; letter-spacing:0.06em; font-size:11px;
    color:var(--cream); background:var(--forest-2);
    border-bottom:1px solid var(--line); padding:10px 8px; white-space:nowrap;
  }
  table.guest-table th.sortable{ cursor:pointer; user-select:none; }
  table.guest-table th.sortable:hover{ background:var(--forest); }
  table.guest-table th .sort-arrow{ display:inline-block; margin-left:3px; opacity:0.6; font-size:9px; }
  table.guest-table th.sort-active .sort-arrow{ opacity:1; }
  table.guest-table tbody tr:nth-child(even) td{ background:rgba(158,131,184,0.08); }
  table.guest-table tbody tr:hover td{ background:rgba(158,131,184,0.16); }
  table.guest-table td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.guest-table input[type=number]{
    width:64px; border:1px solid var(--line); padding:6px 8px; font-family:'Jost',sans-serif;
  }
  table.guest-table button.save-row{
    background:none; border:1px solid var(--gold); color:var(--gold);
    font-size:11px; padding:6px 12px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  table.guest-table button.save-row:hover:not(:disabled){background:var(--gold); color:var(--cream);}
  table.guest-table button.save-row:disabled{ opacity:0.45; cursor:default; }
  .side-select, .category-select, .table-select{
    display:block; width:100%; font-family:'Jost',sans-serif; font-size:12px;
    border:1px solid var(--line); background:var(--cream); padding:5px 6px;
  }
  .table-select:disabled{
    background:#ece7dc; color:#a89f8f; cursor:not-allowed; border-color:#ddd5c4;
  }
  table.guest-table button.delete-row{
    background:none; border:1px solid #c98a8a; color:#b0645f;
    font-size:13px; padding:6px 10px; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  table.guest-table button.delete-row:hover{background:#c98a8a; color:#fff;}
  .loading-note{font-family:'Jost',sans-serif; font-size:13px; color:#7a7268; padding:20px 0;}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 10px; border-radius:20px; font-size:11px;
    font-family:'Jost',sans-serif; letter-spacing:0.03em; font-weight:500;
  }
  .pill svg{ width:9px; height:9px; flex:none; }
  .pill.yes{background:#dfe6df; color:#3f5a41;}
  .pill.no{background:#e9dede; color:#7a4b4b;}
  .pill.guest{background:rgba(191,122,42,0.14); color:#8a5a1f;}
  .pill.muted{background:rgba(51,44,64,0.06); color:var(--ink); opacity:0.55;}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Nancy &amp; Marc</h1>
    <p>Couple's dashboard — enter passcode</p>
    <input type="password" id="passcode-input" placeholder="Passcode" autocomplete="off">
    <div class="gate-error" id="gate-error"></div>
    <button id="gate-submit">Enter</button>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <h1>Guest Dashboard</h1>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
  </header>
  <div class="dash-divider" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l1.6 5.4L15 8l-5.4 1.6L8 15l-1.6-5.4L1 8l5.4-1.6z"/></svg>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><span class="stat-icon" id="icon-total"></span><div><b id="s-total">–</b><div class="label">Responses</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-attending"></span><div><b id="s-attending">–</b><div class="label">Attending</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-guests"></span><div><b id="s-guests">–</b><div class="label">Total Guests</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-declined"></span><div><b id="s-declined">–</b><div class="label">Declined</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-seated"></span><div><b id="s-seated">–</b><div class="label">Seated</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-unseated"></span><div><b id="s-unseated">–</b><div class="label">Unseated</div></div></div>
  </div>

  <h2 class="section-head" id="head-chart"></h2>
  <div class="chart-section" id="chart-section">
    <div class="loading-note">Loading…</div>
  </div>

  <h2 class="section-head" id="head-seating"></h2>
  <div class="seating-grid" id="seating-grid">
    <div class="loading-note">Loading…</div>
  </div>

  <h2 class="section-head" id="head-list"></h2>
  <div class="search-row">
    <input type="text" id="search-input" placeholder="Search by name…">
    <span class="search-count" id="search-count"></span>
  </div>
  <div id="table-wrap"><div class="loading-note">Loading…</div></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCtiGIjE_avSstphgp7uo8XX2A4bPMHw3g",
  authDomain: "nancy-marc-wedding.firebaseapp.com",
  projectId: "nancy-marc-wedding",
  storageBucket: "nancy-marc-wedding.firebasestorage.app",
  messagingSenderId: "390527284227",
  appId: "1:390527284227:web:51f20657d4e95c2be08a36"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'wedding_data';
const PASSCODE = 'MN2026';

let allEntries = [];
let sortState = { key: 'name', dir: 1 };

// ---- small inline icon set (stroke-based, currentColor, no external deps) ----
const ICONS = {
  responses: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  xcircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  seat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"/><path d="M4 10h16v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6z"/><line x1="6" y1="18" x2="6" y2="21"/><line x1="18" y1="18" x2="18" y2="21"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  checkSmall: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  xSmall: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  guestPlus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>'
};

document.getElementById('icon-total').innerHTML = ICONS.responses;
document.getElementById('icon-attending').innerHTML = ICONS.check;
document.getElementById('icon-guests').innerHTML = ICONS.users;
document.getElementById('icon-declined').innerHTML = ICONS.xcircle;
document.getElementById('icon-seated').innerHTML = ICONS.seat;
document.getElementById('icon-unseated').innerHTML = ICONS.clock;
document.getElementById('head-chart').innerHTML = ICONS.seat + ' Guests Seated';
document.getElementById('head-seating').innerHTML = ICONS.grid + ' Seating Chart';
document.getElementById('head-list').innerHTML = ICONS.list + ' Guest List';

document.getElementById('gate-submit').addEventListener('click', tryEnter);
document.getElementById('passcode-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });
function tryEnter(){
  const val = document.getElementById('passcode-input').value;
  if(val === PASSCODE){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('dashboard').classList.add('show');
    loadData();
  } else {
    document.getElementById('gate-error').textContent = 'Incorrect passcode.';
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadData);
document.getElementById('search-input').addEventListener('input', renderTable);

async function loadData(){
  document.getElementById('table-wrap').innerHTML = '<div class="loading-note">Loading…</div>';
  document.getElementById('seating-grid').innerHTML = '<div class="loading-note">Loading…</div>';
  document.getElementById('chart-section').innerHTML = '<div class="loading-note">Loading…</div>';
  try{
    const snap = await db.collection(COLLECTION).get();
    allEntries = [];
    snap.forEach(doc=>{
      if(doc.id.startsWith('rsvp:')){
        try{
          const raw = doc.data();
          const parsed = typeof raw.value === 'string' ? JSON.parse(raw.value) : raw;
          if(parsed && typeof parsed.name === 'string'){
            allEntries.push({ key: doc.id, data: parsed });
          }
        }catch(_){ /* skip malformed entry */ }
      }
    });
    allEntries.sort((a,b)=> a.data.name.localeCompare(b.data.name));
    renderStats();
    renderChart();
    renderSeating();
    renderTable();
  }catch(err){
    document.getElementById('table-wrap').innerHTML = '<div class="loading-note">Could not load data — check your connection.</div>';
    console.error(err);
  }
}

function renderChart(){
  const chartEl = document.getElementById('chart-section');
  // Headcount (a "yes" + their +1 counts as 2 guests), split into seated
  // (table assigned), awaiting a table, and declined.
  const headcount = (data) => 1 + (data.attending === 'yes' && data.plusOne === 'yes' ? 1 : 0);
  let seated = 0, awaiting = 0, declined = 0;
  allEntries.forEach(({data}) => {
    if(data.attending === 'yes' && data.tableNumber){ seated += headcount(data); }
    else if(data.attending === 'yes'){ awaiting += headcount(data); }
    else { declined += headcount(data); }
  });
  const total = seated + awaiting + declined;
  if(total === 0){
    chartEl.innerHTML = '<div class="loading-note">No RSVPs yet.</div>';
    return;
  }
  const segs = [
    { cls:'seated',   label:'Seated',         count:seated },
    { cls:'awaiting', label:'Awaiting table', count:awaiting },
    { cls:'declined', label:'Declined',       count:declined }
  ].filter(s => s.count > 0);
  chartEl.innerHTML = `
    <div class="chart-bar">
      ${segs.map(s => `<div class="chart-seg ${s.cls}" style="width:${(s.count/total*100).toFixed(2)}%"></div>`).join('')}
    </div>
    <div class="chart-legend">
      ${segs.map(s => `<div class="chart-legend-item ${s.cls}"><span class="chart-legend-dot"></span>${s.label}: <b>${s.count}</b></div>`).join('')}
    </div>
  `;
}

function renderStats(){
  const attending = allEntries.filter(e=>e.data.attending==='yes');
  const declined = allEntries.filter(e=>e.data.attending==='no');
  const plusOnes = attending.filter(e=>e.data.plusOne==='yes').length;
  const seated = attending.filter(e=>e.data.tableNumber).length;
  document.getElementById('s-total').textContent = allEntries.length;
  document.getElementById('s-attending').textContent = attending.length;
  document.getElementById('s-guests').textContent = attending.length + plusOnes;
  document.getElementById('s-declined').textContent = declined.length;
  document.getElementById('s-seated').textContent = seated;
  document.getElementById('s-unseated').textContent = attending.length - seated;
}

function renderSeating(){
  const grid = document.getElementById('seating-grid');
  grid.innerHTML = '';
  const attending = allEntries.filter(e=>e.data.attending==='yes');
  const byTable = {};
  const unassigned = [];
  attending.forEach(({data})=>{
    const names = [data.name].concat(data.plusOne==='yes' ? [data.plusOneName || 'Guest'] : []);
    if(data.tableNumber){
      byTable[data.tableNumber] = (byTable[data.tableNumber] || []).concat(names);
    } else {
      unassigned.push(...names);
    }
  });
  const tableNums = Object.keys(byTable).sort((a,b)=>a-b);
  if(tableNums.length === 0 && unassigned.length === 0){
    grid.innerHTML = '<div class="loading-note">No attending guests yet.</div>';
    return;
  }
  tableNums.forEach(num=>{
    const card = document.createElement('div');
    card.className = 'table-card';
    card.innerHTML = `<div class="t-num">Table ${num}</div><ul>${byTable[num].map(n=>`<li>${n}</li>`).join('')}</ul>`;
    grid.appendChild(card);
  });
  if(unassigned.length){
    const card = document.createElement('div');
    card.className = 'table-card unassigned-card';
    card.innerHTML = `<div class="t-num">Unassigned</div><ul>${unassigned.map(n=>`<li>${n}</li>`).join('')}</ul>`;
    grid.appendChild(card);
  }
}

const CATEGORY_OPTIONS = {
  marc: ["Marc's Family","Marc's Church Friends","Marc's Work Friends","Marc's University Friends","Marc's School Friends","Marc's Army Friends"],
  nancy: ["Nancy's Family","Nancy's Church Friends","Nancy's Work Friends","Nancy's University Friends","Nancy's School Friends"]
};

// PLACEHOLDER table ranges — replace these with your final layout once it's decided.
// range(a,b) means tables a through b inclusive. Any category not listed here
// falls back to its side's overall range, and if no side is chosen, all 50 tables show.
function range(a,b){ const arr=[]; for(let i=a;i<=b;i++) arr.push(i); return arr; }
const SIDE_RANGES = {
  marc: range(1,20),
  nancy: range(21,40)
};
const CATEGORY_RANGES = {
  "Marc's Family": range(1,5)
  // Add the rest once you send the final layout, e.g.:
  // "Marc's Church Friends": range(6,9),
  // "Nancy's Family": range(21,25),
};
const ALL_TABLES = range(1,50);

function getTableOptions(side, category){
  if(category && CATEGORY_RANGES[category]) return CATEGORY_RANGES[category];
  if(side && SIDE_RANGES[side]) return SIDE_RANGES[side];
  return ALL_TABLES;
}

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  const countEl = document.getElementById('search-count');
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const filtered = allEntries.filter(e=> e.data.name.toLowerCase().includes(q));

  countEl.textContent = allEntries.length
    ? `Showing ${filtered.length} of ${allEntries.length}`
    : '';

  if(filtered.length === 0){
    wrap.innerHTML = allEntries.length
      ? '<div class="loading-note">No matching guests.</div>'
      : '<div class="loading-note">No RSVPs yet.</div>';
    return;
  }

  const sorters = {
    name:   (e) => e.data.name.toLowerCase(),
    status: (e) => e.data.attending === 'yes' ? 0 : 1,
    table:  (e) => e.data.tableNumber || 9999
  };
  const sortFn = sorters[sortState.key] || sorters.name;
  filtered.sort((a,b)=>{
    const av = sortFn(a), bv = sortFn(b);
    if(av < bv) return -1 * sortState.dir;
    if(av > bv) return 1 * sortState.dir;
    return a.data.name.localeCompare(b.data.name);
  });

  const arrow = (key) => sortState.key === key ? (sortState.dir === 1 ? '▲' : '▼') : '▲';
  const activeCls = (key) => sortState.key === key ? 'sort-active' : '';

  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const tbl = document.createElement('table');
  tbl.className = 'guest-table';
  tbl.innerHTML = `<thead><tr>
    <th class="sortable ${activeCls('name')}" data-sort="name">Name <span class="sort-arrow">${arrow('name')}</span></th>
    <th class="sortable ${activeCls('status')}" data-sort="status">Status <span class="sort-arrow">${arrow('status')}</span></th>
    <th>+1</th><th>Submitted</th><th>Relation</th>
    <th class="sortable ${activeCls('table')}" data-sort="table">Table <span class="sort-arrow">${arrow('table')}</span></th>
    <th></th><th></th>
  </tr></thead><tbody></tbody>`;
  const tbody = tbl.querySelector('tbody');
  filtered.forEach(({key, data})=>{
    const tr = document.createElement('tr');
    const currentSide = data.side || '';
    const sideOptionsHTML = `
      <option value="" ${currentSide==='' ? 'selected':''}>—</option>
      <option value="marc" ${currentSide==='marc' ? 'selected':''}>Marc</option>
      <option value="nancy" ${currentSide==='nancy' ? 'selected':''}>Nancy</option>
    `;
    const statusPill = data.attending==='yes'
      ? `<span class="pill yes">${ICONS.checkSmall}Attending</span>`
      : `<span class="pill no">${ICONS.xSmall}Declined</span>`;
    const plusOnePill = data.plusOne==='yes'
      ? `<span class="pill guest">${ICONS.guestPlus}${data.plusOneName || 'Guest'}</span>`
      : `<span class="pill muted">—</span>`;
    tr.innerHTML = `
      <td>${data.name}</td>
      <td>${statusPill}</td>
      <td>${plusOnePill}</td>
      <td>${data.submittedAt || '—'}</td>
      <td>
        <select class="side-select">${sideOptionsHTML}</select>
        <select class="category-select" style="margin-top:4px;"><option value="">—</option></select>
      </td>
      <td><select class="table-select" ${(data.attending!=='yes' || !currentSide) ? 'disabled':''}></select></td>
      <td><button class="save-row" ${data.attending!=='yes' ? 'disabled':''}>Save</button></td>
      <td><button class="delete-row" title="Delete this RSVP">🗑</button></td>
    `;
    const tableSelect = tr.querySelector('.table-select');
    const btn = tr.querySelector('.save-row');
    const delBtn = tr.querySelector('.delete-row');
    const sideSelect = tr.querySelector('.side-select');
    const categorySelect = tr.querySelector('.category-select');

    function populateCategories(selectedValue){
      const opts = CATEGORY_OPTIONS[sideSelect.value] || [];
      categorySelect.innerHTML = '<option value="">—</option>' +
        opts.map(c => `<option value="${c}" ${c===selectedValue ? 'selected':''}>${c}</option>`).join('');
    }
    function populateTables(){
      const opts = getTableOptions(sideSelect.value, categorySelect.value);
      const current = data.tableNumber;
      tableSelect.innerHTML = '<option value="">—</option>' +
        opts.map(n => `<option value="${n}" ${n===current ? 'selected':''}>${n}</option>`).join('');
      // If the guest's saved table isn't in the filtered list, still show it so we don't silently lose data.
      if(current && !opts.includes(current)){
        const opt = document.createElement('option');
        opt.value = current; opt.textContent = `${current} (outside current range)`; opt.selected = true;
        tableSelect.appendChild(opt);
      }
      // Table number stays locked until a relation (side) is chosen.
      if(data.attending!=='yes'){
        tableSelect.disabled = true;
        tableSelect.title = 'Guest declined';
      } else if(!sideSelect.value){
        tableSelect.disabled = true;
        tableSelect.value = '';
        tableSelect.title = 'Choose a relation first';
      } else {
        tableSelect.disabled = false;
        tableSelect.title = '';
      }
    }
    populateCategories(data.category || '');
    populateTables();
    sideSelect.addEventListener('change', ()=>{ populateCategories(''); populateTables(); });
    categorySelect.addEventListener('change', populateTables);

    btn.addEventListener('click', async ()=>{
      const val = parseInt(tableSelect.value, 10);
      data.tableNumber = val || null;
      data.side = sideSelect.value || '';
      data.category = categorySelect.value || '';
      btn.textContent = 'Saving…';
      try{
        await db.collection(COLLECTION).doc(key).set({
          value: JSON.stringify(data), shared: true, updatedAt: Date.now()
        });
        btn.textContent = 'Saved ✓';
        renderStats();
        renderChart();
        renderSeating();
        setTimeout(()=>{ btn.textContent = 'Save'; }, 1400);
      }catch(err){
        btn.textContent = 'Error';
        console.error(err);
      }
    });

    delBtn.addEventListener('click', async ()=>{
      const ok = window.confirm(`Delete ${data.name}'s RSVP? This cannot be undone.`);
      if(!ok) return;
      delBtn.textContent = '…';
      delBtn.disabled = true;
      try{
        await db.collection(COLLECTION).doc(key).delete();
        allEntries = allEntries.filter(e => e.key !== key);
        renderStats();
        renderChart();
        renderSeating();
        renderTable();
      }catch(err){
        delBtn.textContent = '🗑';
        delBtn.disabled = false;
        console.error(err);
      }
    });

    tbody.appendChild(tr);
  });
  scroll.appendChild(tbl);
  wrap.innerHTML = '';
  wrap.appendChild(scroll);

  tbl.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if(sortState.key === key){ sortState.dir *= -1; }
      else { sortState = { key, dir: 1 }; }
      renderTable();
    });
  });
}
</script>
