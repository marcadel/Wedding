<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nancy & Marc — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#332C40;
    --forest:#4B3F5E;
    --forest-2:#6B5A82;
    --ivory:#EBE5D9;
    --ivory-2:#DDD5C4;
    --gold:#9E83B8;
    --gold-light:#CCBBDB;
    --burgundy:#5C6B5E;
    --cream:#F7F4EC;
    --line: rgba(158,131,184,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    font-size:16px;
  }
  .label{
    font-family:'Jost', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11px;
    font-weight:500;
    color:var(--gold);
  }

  /* ---------- GATE ---------- */
  #gate{
    position:fixed; inset:0;
    background:linear-gradient(160deg, var(--ink) 0%, var(--forest) 55%, var(--forest-2) 100%);
    display:flex; align-items:center; justify-content:center;
    z-index:10;
  }
  #gate.hidden{display:none;}
  .gate-box{
    text-align:center;
    color:var(--cream);
    padding:20px;
  }
  .gate-box h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:34px;
    margin:0 0 6px;
  }
  .gate-box p{color:var(--ivory-2); margin:0 0 22px; font-size:14px;}
  .gate-box input{
    background:transparent;
    border:1px solid rgba(251,246,234,0.35);
    color:var(--cream);
    padding:12px 16px;
    font-family:'Jost',sans-serif;
    font-size:15px;
    text-align:center;
    letter-spacing:0.1em;
    width:220px;
  }
  .gate-box button{
    display:block;
    margin:16px auto 0;
    background:var(--gold);
    border:none;
    color:var(--ink);
    padding:12px 30px;
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .gate-error{color:#e2a3a3; font-size:13px; margin-top:12px; font-family:'Jost',sans-serif; min-height:16px;}

  /* ---------- LAYOUT ---------- */
  #dashboard{display:none; max-width:1080px; margin:0 auto; padding:36px 20px 80px;}
  #dashboard.show{display:block;}
  header.top{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px; flex-wrap:wrap; gap:12px;
  }
  header.top h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600; font-size:32px; margin:0; color:var(--forest);
  }
  .dash-divider{
    display:flex; align-items:center; gap:10px;
    margin:0 0 34px; color:var(--gold);
  }
  .dash-divider::before, .dash-divider::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    opacity:0.6;
  }
  .dash-divider::before{ background:linear-gradient(90deg, var(--gold), transparent); }
  .dash-divider::after{ background:linear-gradient(90deg, transparent, var(--gold)); }
  .dash-divider svg{ flex:none; display:block; width:12px; height:12px; }
  .refresh-btn{
    background:none; border:1px solid var(--gold); color:var(--gold);
    padding:8px 16px; font-family:'Jost',sans-serif; font-size:12px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .refresh-btn:hover{background:var(--gold); color:var(--cream);}

  /* stats */
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:14px; margin-bottom:40px;
  }
  .stat-card{
    display:flex; align-items:center; gap:12px;
    background:var(--cream); border:1px solid var(--line);
    padding:18px 20px; text-align:left;
    box-shadow:0 10px 26px -18px rgba(51,44,64,0.45);
  }
  .stat-icon{
    flex:none; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(158,131,184,0.16); color:var(--forest-2);
  }
  .stat-icon svg{ width:17px; height:17px; }
  .stat-card b{
    display:block; font-family:'Cormorant Garamond', serif;
    font-size:30px; color:var(--forest); font-weight:600; line-height:1.1;
  }

  /* section heads */
  h2.section-head{
    display:flex; align-items:center; gap:8px;
    font-family:'Cormorant Garamond', serif; font-weight:600;
    font-size:24px; color:var(--forest); margin:0 0 16px;
    border-bottom:1px solid var(--line); padding-bottom:10px;
  }
  h2.section-head svg{ width:18px; height:18px; flex:none; color:var(--gold); }

  /* guests-seated chart */
  .chart-section{
    background:var(--cream); border:1px solid var(--line);
    padding:18px 20px 20px; margin-bottom:44px;
  }
  .chart-bar{
    display:flex; gap:2px; width:100%; height:20px;
    border-radius:10px; overflow:hidden;
    background:var(--ivory); border:1px solid var(--line);
  }
  .chart-seg{ height:100%; }
  .chart-seg.seated   { background:#6E4FA0; }
  .chart-seg.awaiting { background:#BF7A2A; }
  .chart-seg.declined { background:#A83A3A; }
  .chart-legend{ display:flex; gap:20px; flex-wrap:wrap; margin-top:12px; font-size:13.5px; font-family:'Jost',sans-serif; }
  .chart-legend-item{ display:flex; align-items:center; gap:7px; }
  .chart-legend-dot{ width:10px; height:10px; border-radius:3px; flex:none; }
  .chart-legend-item b{ font-weight:600; color:var(--forest); }
  .chart-legend-item.seated   .chart-legend-dot { background:#6E4FA0; }
  .chart-legend-item.awaiting .chart-legend-dot { background:#BF7A2A; }
  .chart-legend-item.declined .chart-legend-dot { background:#A83A3A; }

  /* seating chart */
  .seating-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:14px; margin-bottom:48px;
  }
  .table-card{
    background:var(--cream); border:1px solid var(--line); padding:16px;
  }
  .table-card .t-num{
    font-family:'Cormorant Garamond', serif; font-size:20px; font-weight:600;
    color:var(--gold); margin-bottom:0;
  }
  .table-card ul{margin:0; padding-left:18px; font-size:14px;}
  .unassigned-card{border-color:#c98a8a;}
  .unassigned-card .t-num{color:#b0645f;}
  .t-num-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:2px; }
  .table-card .t-subnum{ font-family:'Jost',sans-serif; font-size:11px; color:#7a7268; margin-bottom:6px; }
  .table-card .t-capacity{ font-family:'Jost',sans-serif; font-size:11.5px; color:#7a7268; margin-bottom:8px; }
  .table-card .t-capacity.over{ color:#a83a3a; font-weight:600; }
  .label-edit-btn{
    background:none; border:none; color:var(--gold); opacity:0.6; cursor:pointer;
    font-size:13px; padding:2px 4px; flex:none; line-height:1;
  }
  .label-edit-btn:hover{ opacity:1; }
  .label-input{
    font-family:'Cormorant Garamond', serif; font-size:18px; font-weight:600;
    color:var(--forest); border:1px solid var(--line); background:#fff;
    padding:2px 6px; width:100%;
  }
  .merged-card .t-num{ margin-bottom:2px; }
  .merged-card > .t-capacity{ padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .merged-sub{ margin-top:10px; }
  .merged-sub:first-of-type{ margin-top:0; }
  .merged-sub + .merged-sub{ padding-top:10px; border-top:1px dashed var(--line); }
  .table-card .t-num.sub{ font-size:16px; }
  .t-subnum-empty{ opacity:0.55; font-style:italic; }

  /* ---------- MERGE TABLES ---------- */
  .merge-panel{
    background:var(--cream); border:1px solid var(--line);
    padding:18px 20px 20px; margin-bottom:48px;
  }
  .merge-form{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:'Jost',sans-serif; font-size:13px; margin-bottom:14px; }
  .merge-form select{ padding:8px 10px; border:1px solid var(--line); background:#fff; font-family:'Jost',sans-serif; font-size:13px; }
  .merge-form button{
    background:var(--forest); border:1px solid var(--forest); color:var(--cream);
    padding:8px 16px; font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.05em;
    text-transform:uppercase; cursor:pointer; transition:opacity 0.15s ease;
  }
  .merge-form button:hover:not(:disabled){ opacity:0.85; }
  .merge-form button:disabled{ opacity:0.5; cursor:default; }
  .merge-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid var(--line); font-family:'Jost',sans-serif; font-size:13.5px;
  }
  .merge-item:last-child{ border-bottom:none; }
  .merge-item button{
    background:none; border:1px solid #c98a8a; color:#b0645f;
    font-size:11px; padding:5px 10px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .merge-item button:hover{ background:#c98a8a; color:#fff; }
  .merge-empty{ font-size:13px; color:#7a7268; font-family:'Jost',sans-serif; }

  /* guest table */
  .search-row{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .search-row input{
    width:100%; max-width:320px;
    padding:10px 14px; font-family:'EB Garamond',serif; font-size:15px;
    border:1px solid var(--line); background:var(--cream);
  }
  .search-count{ font-family:'Jost',sans-serif; font-size:12px; color:#7a7268; }
  .search-row select{
    padding:10px 12px; font-family:'Jost',sans-serif; font-size:13px;
    border:1px solid var(--line); background:var(--cream); color:var(--ink);
  }
  .table-scroll{
    max-height:52vh; overflow-y:auto; overflow-x:auto;
    border:1px solid var(--line);
  }
  table.guest-table{width:100%; border-collapse:collapse; font-family:'Jost',sans-serif; font-size:13.5px; background:var(--cream);}
  table.guest-table thead th{
    position:sticky; top:0; z-index:1;
    text-align:left; text-transform:uppercase; letter-spacing:0.06em; font-size:11px;
    color:var(--cream); background:var(--forest-2);
    border-bottom:1px solid var(--line); padding:10px 8px; white-space:nowrap;
  }
  table.guest-table th.sortable{ cursor:pointer; user-select:none; }
  table.guest-table th.sortable:hover{ background:var(--forest); }
  table.guest-table th .sort-arrow{ display:inline-block; margin-left:3px; opacity:0.6; font-size:9px; }
  table.guest-table th.sort-active .sort-arrow{ opacity:1; }
  table.guest-table tbody tr:nth-child(even) td{ background:rgba(158,131,184,0.08); }
  table.guest-table tbody tr:hover td{ background:rgba(158,131,184,0.16); }
  table.guest-table td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.guest-table input[type=number]{
    width:64px; border:1px solid var(--line); padding:6px 8px; font-family:'Jost',sans-serif;
  }
  table.guest-table button.save-row{
    background:none; border:1px solid var(--gold); color:var(--gold);
    font-size:11px; padding:6px 12px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  table.guest-table button.save-row:hover:not(:disabled){background:var(--gold); color:var(--cream);}
  table.guest-table button.save-row:disabled{ opacity:0.45; cursor:default; }
  .side-select, .category-select, .table-select, .plusone-select, .plusone-name{
    display:block; width:100%; font-family:'Jost',sans-serif; font-size:12px;
    border:1px solid var(--line); background:var(--cream); padding:5px 6px;
  }
  .plusone-name{ margin-top:4px; }
  .table-select:disabled{
    background:#ece7dc; color:#a89f8f; cursor:not-allowed; border-color:#ddd5c4;
  }
  table.guest-table button.delete-row{
    background:none; border:1px solid #c98a8a; color:#b0645f;
    font-size:13px; padding:6px 10px; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  table.guest-table button.delete-row:hover{background:#c98a8a; color:#fff;}
  .loading-note{font-family:'Jost',sans-serif; font-size:13px; color:#7a7268; padding:20px 0;}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 10px; border-radius:20px; font-size:11px;
    font-family:'Jost',sans-serif; letter-spacing:0.03em; font-weight:500;
  }
  .pill svg{ width:9px; height:9px; flex:none; }
  .pill.yes{background:#dfe6df; color:#3f5a41;}
  .pill.no{background:#e9dede; color:#7a4b4b;}
  .pill.guest{background:rgba(191,122,42,0.14); color:#8a5a1f;}
  .pill.muted{background:rgba(51,44,64,0.06); color:var(--ink); opacity:0.55;}

  /* ---------- ADD GUEST ---------- */
  .add-guest-btn{
    background:var(--forest); border:1px solid var(--forest); color:var(--cream);
    padding:9px 16px; font-family:'Jost',sans-serif; font-size:12px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
    transition:opacity 0.15s ease; white-space:nowrap;
  }
  .add-guest-btn:hover{ opacity:0.85; }

  .save-all-btn{
    background:none; border:1px solid var(--forest); color:var(--forest);
    padding:9px 16px; font-family:'Jost',sans-serif; font-size:12px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, opacity 0.15s ease; white-space:nowrap;
  }
  .save-all-btn:disabled{ opacity:0.4; cursor:default; }
  .save-all-btn.has-changes{ background:var(--forest); color:var(--cream); }
  .save-all-btn.has-changes:hover{ opacity:0.85; }
  table.guest-table button.save-row.dirty{ background:var(--gold); border-color:var(--gold); color:var(--cream); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(51,44,64,0.55);
    display:none; align-items:center; justify-content:center;
    padding:24px; z-index:30;
  }
  .modal-backdrop.show{ display:flex; }
  .modal-box{
    position:relative; width:100%; max-width:420px;
    background:var(--cream); border:1px solid var(--line);
    padding:28px 26px 24px; box-shadow:0 30px 70px -20px rgba(51,44,64,0.5);
    max-height:calc(100vh - 48px); overflow-y:auto;
  }
  .modal-box h3{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:24px;
    color:var(--forest); margin:0 0 18px;
  }
  .modal-close{
    position:absolute; top:10px; right:14px; background:none; border:none;
    font-size:22px; line-height:1; color:var(--ink); opacity:0.55; cursor:pointer; padding:6px;
  }
  .modal-close:hover{ opacity:1; }
  .field-group{ margin-bottom:16px; }
  .field-group label{
    display:block; font-family:'Jost',sans-serif; font-size:11px; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--gold); margin-bottom:6px;
  }
  .field-group input[type=text]{
    width:100%; padding:9px 12px; font-family:'EB Garamond',serif; font-size:15px;
    border:1px solid var(--line); background:#fff;
  }
  .field-group select{
    width:100%; font-family:'Jost',sans-serif; font-size:13px;
    padding:8px 10px; border:1px solid var(--line); background:#fff;
  }
  .field-group select + select{ margin-top:8px; }
  .radio-row{ display:flex; gap:18px; font-family:'Jost',sans-serif; }
  .radio-row label{
    display:flex; align-items:center; gap:6px; cursor:pointer;
    text-transform:none; letter-spacing:0; color:var(--ink); font-size:13.5px;
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .modal-btn{
    font-family:'Jost',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    padding:9px 18px; cursor:pointer; border:1px solid var(--gold); background:none; color:var(--gold);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .modal-btn:hover{ background:var(--gold); color:var(--cream); }
  .modal-btn.primary{ background:var(--forest); border-color:var(--forest); color:var(--cream); }
  .modal-btn.primary:hover:not(:disabled){ opacity:0.85; background:var(--forest); }
  .modal-btn:disabled{ opacity:0.5; cursor:default; }
  .modal-error{ color:#a83a3a; font-size:12.5px; margin-top:2px; min-height:16px; font-family:'Jost',sans-serif; }
  .admin-added-note{ font-size:10.5px; opacity:0.6; margin-top:2px; }

  /* ---------- BULK TABLE ASSIGNMENT ---------- */
  table.guest-table td.checkbox-cell, table.guest-table th.checkbox-cell{ width:26px; text-align:center; padding-left:12px; }
  .bulk-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0;
    width:calc(100% - 24px); max-width:1080px;
    z-index:20; display:none; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--forest); color:var(--cream);
    padding:14px 20px; font-family:'Jost',sans-serif; font-size:13px;
    box-shadow:0 -10px 30px -10px rgba(51,44,64,0.45);
  }
  .bulk-bar.show{ display:flex; }
  .bulk-bar select{
    padding:7px 10px; font-family:'Jost',sans-serif; font-size:12.5px;
    border:1px solid var(--cream); background:var(--cream); color:var(--ink);
  }
  .bulk-bar button{
    font-family:'Jost',sans-serif; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em;
    padding:8px 14px; cursor:pointer; border:1px solid var(--cream); background:none; color:var(--cream);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .bulk-bar button:hover:not(:disabled){ background:var(--cream); color:var(--forest); }
  .bulk-bar button:disabled{ opacity:0.6; cursor:default; }
  .bulk-bar .bulk-count{ font-weight:600; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Nancy &amp; Marc</h1>
    <p>Couple's dashboard — enter passcode</p>
    <input type="password" id="passcode-input" placeholder="Passcode" autocomplete="off">
    <div class="gate-error" id="gate-error"></div>
    <button id="gate-submit">Enter</button>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <h1>Guest Dashboard</h1>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
  </header>
  <div class="dash-divider" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l1.6 5.4L15 8l-5.4 1.6L8 15l-1.6-5.4L1 8l5.4-1.6z"/></svg>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><span class="stat-icon" id="icon-total"></span><div><b id="s-total">–</b><div class="label">Responses</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-attending"></span><div><b id="s-attending">–</b><div class="label">Attending</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-guests"></span><div><b id="s-guests">–</b><div class="label">Total Guests</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-declined"></span><div><b id="s-declined">–</b><div class="label">Declined</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-seated"></span><div><b id="s-seated">–</b><div class="label">Seated</div></div></div>
    <div class="stat-card"><span class="stat-icon" id="icon-unseated"></span><div><b id="s-unseated">–</b><div class="label">Unseated</div></div></div>
  </div>

  <h2 class="section-head" id="head-chart"></h2>
  <div class="chart-section" id="chart-section">
    <div class="loading-note">Loading…</div>
  </div>

  <h2 class="section-head" id="head-seating"></h2>
  <div class="seating-grid" id="seating-grid">
    <div class="loading-note">Loading…</div>
  </div>

  <h2 class="section-head" id="head-merge"></h2>
  <div class="merge-panel">
    <div class="merge-form">
      <select id="mergeTableA"><option value="">Table…</option></select>
      <span>+</span>
      <select id="mergeTableB"><option value="">Table…</option></select>
      <button id="mergeBtn" type="button">Merge</button>
    </div>
    <div id="merge-list"><div class="merge-empty">Loading…</div></div>
  </div>

  <h2 class="section-head" id="head-list"></h2>
  <div class="search-row">
    <input type="text" id="search-input" placeholder="Search by name…">
    <select id="relation-filter"><option value="">All Relations</option></select>
    <span class="search-count" id="search-count"></span>
    <button class="save-all-btn" id="save-all-btn" disabled>Save All</button>
    <button class="add-guest-btn" id="add-guest-btn">+ Add Guest</button>
  </div>
  <div id="table-wrap"><div class="loading-note">Loading…</div></div>
</div>

// Rows with unsaved edits (side/category/table/+1). rowSavers holds each
// row's own save function so "Save All" can trigger every dirty row's save
// in one go, even one that's currently hidden by a search/filter.
let dirtyKeys = new Set();
let rowSavers = new Map();
function markDirty(key, tr){
  dirtyKeys.add(key);
  const saveBtn = tr.querySelector('.save-row');
  if(saveBtn) saveBtn.classList.add('dirty');
  updateSaveAllButton();
}
function clearDirty(key, tr){
  dirtyKeys.delete(key);
  const saveBtn = tr && tr.querySelector('.save-row');
  if(saveBtn) saveBtn.classList.remove('dirty');
  updateSaveAllButton();
}
function updateSaveAllButton(){
  const btn = document.getElementById('save-all-btn');
  btn.disabled = dirtyKeys.size === 0;
  btn.classList.toggle('has-changes', dirtyKeys.size > 0);
  btn.textContent = dirtyKeys.size > 0 ? `Save All (${dirtyKeys.size})` : 'Save All';
}
document.getElementById('save-all-btn').addEventListener('click', async ()=>{
  const btn = document.getElementById('save-all-btn');
  const keys = Array.from(dirtyKeys);
  if(keys.length === 0) return;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  let succeeded = 0;
  const failures = [];
  for(const key of keys){
    const saver = rowSavers.get(key);
    if(!saver){ dirtyKeys.delete(key); continue; }
    try{
      const result = await saver({ silent: true });
      if(result && result.ok){ succeeded++; }
      else { failures.push({ key, reason: result ? result.reason : 'unknown error' }); }
    }catch(err){
      failures.push({ key, reason: 'network error' });
      console.error(err);
    }
  }
  updateSaveAllButton();
  if(failures.length){
    const names = failures.map(f => {
      const entry = allEntries.find(e => e.key === f.key);
      return (entry ? entry.data.name : f.key) + ' (' + f.reason + ')';
    }).join(', ');
    alert(`Saved ${succeeded} change(s). ${failures.length} could not be saved: ${names}`);
  }
});

const TABLE_CAPACITY = 10;

  return String(name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

async function loadData(){
  document.getElementById('table-wrap').innerHTML = '<div class="loading-note">Loading…</div>';
  document.getElementById('seating-grid').innerHTML = '<div class="loading-note">Loading…</div>';
  document.getElementById('chart-section').innerHTML = '<div class="loading-note">Loading…</div>';
  try{
    const snap = await db.collection(COLLECTION).get();
    allEntries = [];
    songsByGuest = {};
    tableConfig = { labels: {}, merges: [] };
    snap.forEach(doc=>{
      if(doc.id === 'table_config'){
        try{
          const raw = doc.data();
          const parsed = typeof raw.value === 'string' ? JSON.parse(raw.value) : raw;
          if(parsed){
            tableConfig = { labels: parsed.labels || {}, merges: parsed.merges || [] };
          }
        }catch(_){ /* skip malformed config */ }
      } else if(doc.id.startsWith('rsvp:')){
        try{
          const raw = doc.data();
          const parsed = typeof raw.value === 'string' ? JSON.parse(raw.value) : raw;
          if(parsed && typeof parsed.name === 'string'){
            allEntries.push({ key: doc.id, data: parsed });
          }
        }catch(_){ /* skip malformed entry */ }
      } else if(doc.id.startsWith('song:')){
        try{
          const raw = doc.data();
          const parsed = typeof raw.value === 'string' ? JSON.parse(raw.value) : raw;
          if(parsed && typeof parsed.guestName === 'string' && typeof parsed.songName === 'string'){
            const slug = slugify(parsed.guestName);
            if(!songsByGuest[slug]) songsByGuest[slug] = [];
            songsByGuest[slug].push(parsed);
          }
        }catch(_){ /* skip malformed entry */ }
      }
    });
    allEntries.sort((a,b)=> a.data.name.localeCompare(b.data.name));
    renderStats();
    renderChart();
    renderSeating();
    refreshTableSelectOptions();
    populateMergeSelects();
    renderMergeList();
    renderTable();
  }catch(err){
    document.getElementById('table-wrap').innerHTML = '<div class="loading-note">Could not load data — check your connection.</div>';
    console.error(err);
  }
}

function renderChart(){
  const chartEl = document.getElementById('chart-section');
  // Headcount (a "yes" + their +1 counts as 2 guests), split into seated
  // (table assigned), awaiting a table, and declined.
  const headcount = (data) => 1 + (data.attending === 'yes' && data.plusOne === 'yes' ? 1 : 0);
  let seated = 0, awaiting = 0, declined = 0;
  allEntries.forEach(({data}) => {
    if(data.attending === 'yes' && data.tableNumber){ seated += headcount(data); }
    else if(data.attending === 'yes'){ awaiting += headcount(data); }
    else { declined += headcount(data); }
  });
  const total = seated + awaiting + declined;
  if(total === 0){
    chartEl.innerHTML = '<div class="loading-note">No RSVPs yet.</div>';
    return;
  }
  const segs = [
    { cls:'seated',   label:'Seated',         count:seated },
    { cls:'awaiting', label:'Awaiting table', count:awaiting },
    { cls:'declined', label:'Declined',       count:declined }
  ].filter(s => s.count > 0);
  chartEl.innerHTML = `
    <div class="chart-bar">
      ${segs.map(s => `<div class="chart-seg ${s.cls}" style="width:${(s.count/total*100).toFixed(2)}%"></div>`).join('')}
    </div>
    <div class="chart-legend">
      ${segs.map(s => `<div class="chart-legend-item ${s.cls}"><span class="chart-legend-dot"></span>${s.label}: <b>${s.count}</b></div>`).join('')}
    </div>
  `;
}

function renderStats(){
  const attending = allEntries.filter(e=>e.data.attending==='yes');
  const declined = allEntries.filter(e=>e.data.attending==='no');
  const plusOnes = attending.filter(e=>e.data.plusOne==='yes').length;
  const seated = attending.filter(e=>e.data.tableNumber).length;
  document.getElementById('s-total').textContent = allEntries.length;
  document.getElementById('s-attending').textContent = attending.length;
  document.getElementById('s-guests').textContent = attending.length + plusOnes;
  document.getElementById('s-declined').textContent = declined.length;
  document.getElementById('s-seated').textContent = seated;
  document.getElementById('s-unseated').textContent = attending.length - seated;
}

function renderSeating(){
  const grid = document.getElementById('seating-grid');
  grid.innerHTML = '';
  const attending = allEntries.filter(e=>e.data.attending==='yes');
  const byTable = {};
  const unassigned = [];
  attending.forEach(({data})=>{
    const names = [data.name].concat(data.plusOne==='yes' ? [data.plusOneName || 'Guest'] : []);
    if(data.tableNumber){
      byTable[data.tableNumber] = (byTable[data.tableNumber] || []).concat(names);
    } else {
      unassigned.push(...names);
    }
  });
  const tableNums = Object.keys(byTable).map(Number).sort((a,b)=>a-b);
  if(tableNums.length === 0 && unassigned.length === 0){
    grid.innerHTML = '<div class="loading-note">No attending guests yet.</div>';
    return;
  }
  // Merged tables (e.g. 1+6) render as one combined card even though guests
  // may be spread across either table number underneath. Each table inside
  // the pair keeps and shows its own name.
  const renderedGroups = new Set();
  tableNums.forEach(num=>{
    const group = getMergeGroup(num);
    const groupKey = group.join(',');
    if(renderedGroups.has(groupKey)) return;
    renderedGroups.add(groupKey);

    const allNames = group.reduce((acc,n)=> acc.concat(byTable[n] || []), []);
    const capacity = group.length * TABLE_CAPACITY;
    const isSingle = group.length === 1;

    const card = document.createElement('div');
    card.className = 'table-card' + (isSingle ? '' : ' merged-card');

    if(isSingle){
      const label = getTableLabel(group[0]);
      const plainTitle = `Table ${group[0]}`;
      card.innerHTML = `
        <div class="t-num-row">
          <div class="t-num">${label || plainTitle}</div>
          <button class="label-edit-btn" title="Rename table">✎</button>
        </div>
        ${label ? `<div class="t-subnum">${plainTitle}</div>` : ''}
        <div class="t-capacity ${allNames.length > capacity ? 'over':''}">${allNames.length}/${capacity} seated</div>
        <ul>${allNames.map(n=>`<li>${n}</li>`).join('')}</ul>
      `;
      grid.appendChild(card);
      card.querySelector('.label-edit-btn').addEventListener('click', function(){
        startLabelEdit(this.closest('.t-num-row').querySelector('.t-num'), group[0]);
      });
    } else {
      // Combined heading, e.g. "Table 1 + Table 6", then each table's own
      // name listed underneath with its own guests.
      card.innerHTML = `
        <div class="t-num">Table ${group.join(' + ')}</div>
        <div class="t-capacity ${allNames.length > capacity ? 'over':''}">${allNames.length}/${capacity} seated</div>
        ${group.map(n => `
          <div class="merged-sub" data-table="${n}">
            <div class="t-num-row">
              <div class="t-num sub">Table ${n}</div>
              <button class="label-edit-btn" title="Rename table">✎</button>
            </div>
            <div class="t-subnum">${getTableLabel(n) || '<span class="t-subnum-empty">Click ✎ to name this table</span>'}</div>
            <ul>${(byTable[n]||[]).map(nm=>`<li>${nm}</li>`).join('') || '<li class="t-subnum-empty">No guests yet</li>'}</ul>
          </div>
        `).join('')}
      `;
      grid.appendChild(card);
      card.querySelectorAll('.merged-sub').forEach(sub=>{
        const n = Number(sub.dataset.table);
        sub.querySelector('.label-edit-btn').addEventListener('click', function(){
          startLabelEdit(sub.querySelector('.t-num.sub'), n);
        });
      });
    }
  });
  if(unassigned.length){
    const card = document.createElement('div');
    card.className = 'table-card unassigned-card';
    card.innerHTML = `<div class="t-num">Unassigned</div><ul>${unassigned.map(n=>`<li>${n}</li>`).join('')}</ul>`;
    grid.appendChild(card);
  }
}

function startLabelEdit(numEl, tableNum){
  const current = getTableLabel(tableNum);
  numEl.innerHTML = `<input type="text" class="label-input" placeholder="Table ${tableNum} label…">`;
  const input = numEl.querySelector('.label-input');
  input.value = current;
  input.focus();
  input.select();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    const val = input.value.trim();
    if(val){ tableConfig.labels[tableNum] = val; } else { delete tableConfig.labels[tableNum]; }
    saveTableConfig().then(()=>{
      renderSeating();
      populateMergeSelects();
      refreshTableSelectOptions();
      renderTable();
    }).catch(err=>{
      alert('Could not save the table label — please check your connection and try again.');
      console.error(err);
      renderSeating();
    });
  }
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ input.blur(); }
    else if(e.key === 'Escape'){ committed = true; renderSeating(); }
  });
  input.addEventListener('blur', commit);
}

const CATEGORY_OPTIONS = {

// Tables are shared across both sides — no side or category locks anyone to a
// particular range anymore, so any guest can be seated at any of tables 1-30.
// (SIDE_RANGES / CATEGORY_RANGES are kept empty, not removed, in case a per-side
// or per-category range is ever wanted again later.)
function range(a,b){ const arr=[]; for(let i=a;i<=b;i++) arr.push(i); return arr; }
const SIDE_RANGES = {};
const CATEGORY_RANGES = {};
const ALL_TABLES = range(1,30);

function getTableOptions(side, category){
  if(category && CATEGORY_RANGES[category]) return CATEGORY_RANGES[category];
  if(side && SIDE_RANGES[side]) return SIDE_RANGES[side];
  return ALL_TABLES;
}

// ---------- TABLE MERGING, LABELS & CAPACITY ----------
// Merged tables are stored as pairs of table numbers in tableConfig.merges,
// e.g. [[5,6]] means Table 5 and Table 6 act as one 20-seat unit. A table
// that isn't part of any pair is just itself with a 10-seat capacity.
function getMergeGroup(tableNum){
  const n = Number(tableNum);
  for(const pair of tableConfig.merges){
    if(pair.includes(n)) return pair.slice().sort((a,b)=>a-b);
  }
  return [n];
}
function getTableCapacity(tableNum){
  return getMergeGroup(tableNum).length * TABLE_CAPACITY;
}
function getTableLabel(tableNum){
  return tableConfig.labels[tableNum] || tableConfig.labels[String(tableNum)] || '';
}
// Total attending headcount (a "yes" +1 counts as 2) currently seated at
// tableNum's merge group. Pass excludeKey to leave one guest's own current
// seat out of the count (used when checking if THEY can move somewhere).
function getTableHeadcount(tableNum, excludeKey){
  const group = getMergeGroup(tableNum);
  let sum = 0;
  allEntries.forEach(({key, data})=>{
    if(key === excludeKey) return;
    if(data.attending === 'yes' && data.tableNumber && group.includes(Number(data.tableNumber))){
      sum += 1 + (data.plusOne === 'yes' ? 1 : 0);
    }
  });
  return sum;
}
async function saveTableConfig(){
  await db.collection(COLLECTION).doc('table_config').set({
    value: JSON.stringify(tableConfig), shared: true, updatedAt: Date.now()
  });
}
function tableOptionsHtml(list, currentVal){
  return list.map(n=>{
    const lbl = getTableLabel(n);
    const text = lbl ? `${n} — ${lbl}` : `${n}`;
    return `<option value="${n}" ${String(n)===String(currentVal) ? 'selected':''}>${text}</option>`;
  }).join('');
}
function refreshTableSelectOptions(){
  document.getElementById('bulkTableSelect').innerHTML = '<option value="">Choose table…</option>' +
    tableOptionsHtml(ALL_TABLES);
}
refreshTableSelectOptions();

function populateMergeSelects(){
  const usedTables = new Set(tableConfig.merges.flat());
  const available = ALL_TABLES.filter(n => !usedTables.has(n));
  const optsHtml = '<option value="">Table…</option>' + tableOptionsHtml(available);
  document.getElementById('mergeTableA').innerHTML = optsHtml;
  document.getElementById('mergeTableB').innerHTML = optsHtml;
}

function renderMergeList(){
  const listEl = document.getElementById('merge-list');
  if(tableConfig.merges.length === 0){
    listEl.innerHTML = '<div class="merge-empty">No tables merged yet — every table seats up to 10.</div>';
    return;
  }
  listEl.innerHTML = tableConfig.merges.map((pair, idx)=>{
    const [a,b] = pair;
    const headcount = getTableHeadcount(a);
    return `<div class="merge-item">
      <span>Table ${a} + Table ${b} <span style="opacity:0.6;">(${headcount}/${TABLE_CAPACITY*2} seated)</span></span>
      <button class="unmerge-btn" data-idx="${idx}" type="button">Unmerge</button>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.unmerge-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const removed = tableConfig.merges[idx];
      tableConfig.merges.splice(idx, 1);
      btn.disabled = true;
      try{
        await saveTableConfig();
        populateMergeSelects();
        renderMergeList();
        renderSeating();
        refreshTableSelectOptions();
        renderTable();
      }catch(err){
        tableConfig.merges.splice(idx, 0, removed);
        alert('Could not unmerge those tables — please check your connection and try again.');
        console.error(err);
        renderMergeList();
      }
    });
  });
}

document.getElementById('mergeBtn').addEventListener('click', async ()=>{
  const a = parseInt(document.getElementById('mergeTableA').value, 10);
  const b = parseInt(document.getElementById('mergeTableB').value, 10);
  if(!a || !b){ alert('Choose two tables to merge.'); return; }
  if(a === b){ alert('Choose two different tables.'); return; }
  const btn = document.getElementById('mergeBtn');
  btn.disabled = true;
  tableConfig.merges.push([a,b]);
  try{
    await saveTableConfig();
    populateMergeSelects();
    renderMergeList();
    renderSeating();
    refreshTableSelectOptions();
    renderTable();
  }catch(err){
    tableConfig.merges.pop();
    alert('Could not merge those tables — please check your connection and try again.');
    console.error(err);
  }finally{
    btn.disabled = false;
  }
});

function updateBulkBar(){
  const bar = document.getElementById('bulkBar');
  document.getElementById('bulkCount').textContent = selectedKeys.size;
  bar.classList.toggle('show', selectedKeys.size > 0);
}

document.getElementById('bulkClearBtn').addEventListener('click', ()=>{
  selectedKeys.clear();
  renderTable();
});

document.getElementById('bulkAssignBtn').addEventListener('click', async ()=>{
  const val = parseInt(document.getElementById('bulkTableSelect').value, 10);
  if(!val){ alert('Choose a table number first.'); return; }
  const targets = allEntries.filter(e => selectedKeys.has(e.key));
  const targetKeys = new Set(targets.map(e=>e.key));
  const capacity = getTableCapacity(val);
  const group = getMergeGroup(val);
  let existingOthers = 0;
  allEntries.forEach(({key, data})=>{
    if(targetKeys.has(key)) return;
    if(data.attending==='yes' && data.tableNumber && group.includes(Number(data.tableNumber))){
      existingOthers += 1 + (data.plusOne==='yes' ? 1 : 0);
    }
  });
  let newHeadcount = 0;
  targets.forEach(({data})=>{ newHeadcount += 1 + (data.attending==='yes' && data.plusOne==='yes' ? 1 : 0); });
  if(existingOthers + newHeadcount > capacity){
    alert(`Assigning these ${targets.length} selected guest(s) to Table ${val} would total ${existingOthers + newHeadcount} guests, but it only seats ${capacity}. Choose fewer guests, a different table, or merge tables first.`);
    return;
  }
  const btn = document.getElementById('bulkAssignBtn');
  btn.disabled = true;
  btn.textContent = 'Assigning…';
  try{
    await Promise.all(targets.map(({key, data})=>{
      data.tableNumber = val;
      dirtyKeys.delete(key);
      return db.collection(COLLECTION).doc(key).set({
        value: JSON.stringify(data), shared: true, updatedAt: Date.now()
      });
    }));
    selectedKeys.clear();
    updateSaveAllButton();
    renderStats();
    renderChart();
    renderSeating();
    renderTable();
  }catch(err){
    alert('Something went wrong assigning tables — please check your connection and try again.');
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Assign Table';
  }
});

// ---------- ADD GUEST MODAL ----------
const addGuestBackdrop = document.getElementById('addGuestBackdrop');
const addGuestNameInput = document.getElementById('addGuestName');
const addGuestPlusOneNameGroup = document.getElementById('addGuestPlusOneNameGroup');
const addGuestPlusOneNameInput = document.getElementById('addGuestPlusOneName');
const addGuestSideSelect = document.getElementById('addGuestSide');
const addGuestCategorySelect = document.getElementById('addGuestCategory');
const addGuestError = document.getElementById('addGuestError');
const addGuestSubmitBtn = document.getElementById('addGuestSubmit');

function openAddGuestModal(){
  addGuestNameInput.value = '';
  addGuestPlusOneNameInput.value = '';
  addGuestPlusOneNameGroup.style.display = 'none';
  document.querySelector('input[name="addGuestPlusOne"][value="no"]').checked = true;
  addGuestSideSelect.value = '';
  addGuestCategorySelect.innerHTML = '<option value="">—</option>';
  addGuestError.textContent = '';
  addGuestBackdrop.classList.add('show');
  addGuestNameInput.focus();
}
function closeAddGuestModal(){
  addGuestBackdrop.classList.remove('show');
}
document.getElementById('add-guest-btn').addEventListener('click', openAddGuestModal);
document.getElementById('addGuestClose').addEventListener('click', closeAddGuestModal);
document.getElementById('addGuestCancel').addEventListener('click', closeAddGuestModal);
addGuestBackdrop.addEventListener('click', (e)=>{ if(e.target === addGuestBackdrop) closeAddGuestModal(); });

document.querySelectorAll('input[name="addGuestPlusOne"]').forEach(radio=>{
  radio.addEventListener('change', ()=>{
    const isYes = document.querySelector('input[name="addGuestPlusOne"]:checked').value === 'yes';
    addGuestPlusOneNameGroup.style.display = isYes ? 'block' : 'none';
  });
});

addGuestSideSelect.addEventListener('change', ()=>{
  const opts = CATEGORY_OPTIONS[addGuestSideSelect.value] || [];
  addGuestCategorySelect.innerHTML = '<option value="">—</option>' +
    opts.map(c => `<option value="${c}">${c}</option>`).join('');
});

addGuestSubmitBtn.addEventListener('click', async ()=>{
  const name = addGuestNameInput.value.trim();
  if(!name){
    addGuestError.textContent = "Please enter the guest's name.";
    return;
  }
  const plusOneChoice = document.querySelector('input[name="addGuestPlusOne"]:checked').value;
  const plusOneName = plusOneChoice === 'yes' ? addGuestPlusOneNameInput.value.trim() : '';
  if(plusOneChoice === 'yes' && !plusOneName){
    addGuestError.textContent = 'Please enter the +1\'s name, or switch to "No".';
    return;
  }
  const key = 'rsvp:' + slugify(name);
  addGuestError.textContent = '';
  addGuestSubmitBtn.disabled = true;
  addGuestSubmitBtn.textContent = 'Adding…';
  try{
    const existingDoc = await db.collection(COLLECTION).doc(key).get();
    let existingData = null;
    if(existingDoc.exists){
      const ok = window.confirm(`${name} already has an entry on the guest list. Overwrite it with these details? (Their existing table/relation will be kept unless you set a new one here.)`);
      if(!ok){
        addGuestSubmitBtn.disabled = false;
        addGuestSubmitBtn.textContent = 'Add Guest';
        return;
      }
      try{ existingData = JSON.parse(existingDoc.data().value); }catch(_){}
    }
    // Leaving Relation blank when overwriting an existing guest keeps their
    // current side/category/table rather than wiping seating work already done.
    const data = {
      name,
      attending: 'yes',
      plusOne: plusOneChoice,
      plusOneName,
      tableNumber: existingData ? (existingData.tableNumber || null) : null,
      side: addGuestSideSelect.value || (existingData ? (existingData.side || '') : ''),
      category: addGuestCategorySelect.value || (existingData ? (existingData.category || '') : ''),
      submittedAt: new Date().toLocaleString('en-GB', { timeZone:'Africa/Cairo', dateStyle:'medium', timeStyle:'medium' }) + ' (Cairo)',
      submittedAtMs: Date.now(),
      addedByAdmin: true
    };
    await db.collection(COLLECTION).doc(key).set({
      value: JSON.stringify(data), shared: true, updatedAt: Date.now()
    });
    const idx = allEntries.findIndex(e => e.key === key);
    if(idx >= 0){ allEntries[idx] = { key, data }; }
    else { allEntries.push({ key, data }); }
    allEntries.sort((a,b)=> a.data.name.localeCompare(b.data.name));
    renderStats();
    renderChart();
    renderSeating();
    renderTable();
    closeAddGuestModal();
  }catch(err){
    addGuestError.textContent = 'Something went wrong — please check your connection and try again.';
    console.error(err);
  }finally{
    addGuestSubmitBtn.disabled = false;
    addGuestSubmitBtn.textContent = 'Add Guest';
  }
});

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  const countEl = document.getElementById('search-count');
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const relFilter = document.getElementById('relation-filter').value;
  const filtered = allEntries.filter(e=>{
    if(!e.data.name.toLowerCase().includes(q)) return false;
    if(!relFilter) return true;
    if(relFilter === 'none') return !e.data.side;
    if(relFilter.indexOf('side:') === 0) return e.data.side === relFilter.slice(5);
    if(relFilter.indexOf('cat:') === 0) return e.data.category === relFilter.slice(4);
    return true;
  });

  countEl.textContent = allEntries.length
    ? `Showing ${filtered.length} of ${allEntries.length}`
    : '';

  if(filtered.length === 0){
    wrap.innerHTML = allEntries.length
      ? '<div class="loading-note">No matching guests.</div>'
      : '<div class="loading-note">No RSVPs yet.</div>';
    return;
  }

  const sorters = {
    name:      (e) => e.data.name.toLowerCase(),
    status:    (e) => e.data.attending === 'yes' ? 0 : 1,
    table:     (e) => e.data.tableNumber || 9999,
    submitted: (e) => e.data.submittedAtMs || 0
  };
  const sortFn = sorters[sortState.key] || sorters.name;
  filtered.sort((a,b)=>{
    const av = sortFn(a), bv = sortFn(b);
    if(av < bv) return -1 * sortState.dir;
    if(av > bv) return 1 * sortState.dir;
    return a.data.name.localeCompare(b.data.name);
  });

  const arrow = (key) => sortState.key === key ? (sortState.dir === 1 ? '▲' : '▼') : '▲';
  const activeCls = (key) => sortState.key === key ? 'sort-active' : '';

  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const tbl = document.createElement('table');
  tbl.className = 'guest-table';
  tbl.innerHTML = `<thead><tr>
    <th class="checkbox-cell"><input type="checkbox" id="selectAllCheckbox" title="Select all"></th>
    <th class="sortable ${activeCls('name')}" data-sort="name">Name <span class="sort-arrow">${arrow('name')}</span></th>
    <th class="sortable ${activeCls('status')}" data-sort="status">Status <span class="sort-arrow">${arrow('status')}</span></th>
    <th>+1</th>
    <th class="sortable ${activeCls('submitted')}" data-sort="submitted">Submitted <span class="sort-arrow">${arrow('submitted')}</span></th>
    <th>Relation</th>
    <th class="sortable ${activeCls('table')}" data-sort="table">Table <span class="sort-arrow">${arrow('table')}</span></th>
    <th>Song Request</th>
    <th></th><th></th>
  </tr></thead><tbody></tbody>`;
  const tbody = tbl.querySelector('tbody');
  const selectAllCb = tbl.querySelector('#selectAllCheckbox');
  function refreshSelectAllState(){
    const cbs = Array.from(tbl.querySelectorAll('.row-checkbox:not(:disabled)'));
    if(cbs.length === 0){ selectAllCb.checked = false; selectAllCb.indeterminate = false; return; }
    const checkedCount = cbs.filter(cb => cb.checked).length;
    selectAllCb.checked = checkedCount === cbs.length;
    selectAllCb.indeterminate = checkedCount > 0 && checkedCount < cbs.length;
  }
  selectAllCb.addEventListener('change', ()=>{
    tbl.querySelectorAll('.row-checkbox:not(:disabled)').forEach(cb=>{
      cb.checked = selectAllCb.checked;
      cb.dispatchEvent(new Event('change'));
    });
  });
  filtered.forEach(({key, data})=>{
    const tr = document.createElement('tr');
    const currentSide = data.side || '';
    const sideOptionsHTML = `
      <option value="" ${currentSide==='' ? 'selected':''}>—</option>
      <option value="marc" ${currentSide==='marc' ? 'selected':''}>Marc</option>
      <option value="nancy" ${currentSide==='nancy' ? 'selected':''}>Nancy</option>
    `;
    const statusPill = data.attending==='yes'
      ? `<span class="pill yes">${ICONS.checkSmall}Attending</span>`
      : `<span class="pill no">${ICONS.xSmall}Declined</span>`;
    const songs = songsByGuest[slugify(data.name)] || [];
    const songCell = songs.length
      ? songs.map(s => `<div>${s.songName}${s.artist ? ' <span style="opacity:0.6;">— ' + s.artist + '</span>' : ''}</div>`).join('')
      : `<span class="pill muted">—</span>`;
    const adminNote = data.addedByAdmin ? '<div class="admin-added-note">Added by admin</div>' : '';
    const notAttending = data.attending!=='yes';
    tr.innerHTML = `
      <td class="checkbox-cell"><input type="checkbox" class="row-checkbox" ${notAttending ? 'disabled title="Guest declined"':''}></td>
      <td>${data.name}</td>
      <td>${statusPill}</td>
      <td>
        <select class="plusone-select" ${notAttending ? 'disabled':''}>
          <option value="no" ${data.plusOne!=='yes' ? 'selected':''}>No +1</option>
          <option value="yes" ${data.plusOne==='yes' ? 'selected':''}>+1</option>
        </select>
        <input type="text" class="plusone-name" placeholder="+1's name" ${notAttending ? 'disabled':''}
               value="${(data.plusOneName||'').replace(/"/g,'&quot;')}"
               style="display:${data.plusOne==='yes' ? 'block':'none'};">
      </td>
      <td>${data.submittedAt || '—'}${adminNote}</td>
      <td>
        <select class="side-select">${sideOptionsHTML}</select>
        <select class="category-select" style="margin-top:4px;"><option value="">—</option></select>
      </td>
      <td><select class="table-select" ${(data.attending!=='yes' || !currentSide) ? 'disabled':''}></select></td>
      <td>${songCell}</td>
      <td><button class="save-row" ${data.attending!=='yes' ? 'disabled':''}>Save</button></td>
      <td><button class="delete-row" title="Delete this RSVP">🗑</button></td>
    `;
    const tableSelect = tr.querySelector('.table-select');
    const btn = tr.querySelector('.save-row');
    const delBtn = tr.querySelector('.delete-row');
    const sideSelect = tr.querySelector('.side-select');
    const categorySelect = tr.querySelector('.category-select');
    const plusOneSelect = tr.querySelector('.plusone-select');
    const plusOneNameInput = tr.querySelector('.plusone-name');
    const rowCheckbox = tr.querySelector('.row-checkbox');
    if(dirtyKeys.has(key)) btn.classList.add('dirty');
    plusOneSelect.addEventListener('change', ()=>{
      const newVal = plusOneSelect.value;
      if(newVal === 'yes' && data.tableNumber){
        const capacity = getTableCapacity(data.tableNumber);
        const others = getTableHeadcount(data.tableNumber, key);
        if(others + 2 > capacity){
          alert(`Adding a +1 would put Table ${data.tableNumber} over its ${capacity}-guest limit. Choose a different table first, or merge tables.`);
          plusOneSelect.value = 'no';
          return;
        }
      }
      plusOneNameInput.style.display = newVal === 'yes' ? 'block' : 'none';
      data.plusOne = newVal;
      if(newVal !== 'yes'){ data.plusOneName = ''; plusOneNameInput.value = ''; }
      markDirty(key, tr);
    });
    plusOneNameInput.addEventListener('input', ()=>{
      data.plusOneName = plusOneNameInput.value.trim();
      markDirty(key, tr);
    });
    rowCheckbox.checked = selectedKeys.has(key);
    rowCheckbox.addEventListener('change', ()=>{
      if(rowCheckbox.checked){ selectedKeys.add(key); } else { selectedKeys.delete(key); }
      updateBulkBar();
      refreshSelectAllState();
    });

    function populateCategories(selectedValue){
      const opts = CATEGORY_OPTIONS[sideSelect.value] || [];
      categorySelect.innerHTML = '<option value="">—</option>' +
        opts.map(c => `<option value="${c}" ${c===selectedValue ? 'selected':''}>${c}</option>`).join('');
    }
    function populateTables(){
      const opts = getTableOptions(sideSelect.value, categorySelect.value);
      const current = data.tableNumber;
      tableSelect.innerHTML = '<option value="">—</option>' + tableOptionsHtml(opts, current);
      // If the guest's saved table isn't in the filtered list, still show it so we don't silently lose data.
      if(current && !opts.includes(current)){
        const opt = document.createElement('option');
        opt.value = current; opt.textContent = `${current} (outside current range)`; opt.selected = true;
        tableSelect.appendChild(opt);
      }
      // Table number stays locked until a relation (side) is chosen.
      if(data.attending!=='yes'){
        tableSelect.disabled = true;
        tableSelect.title = 'Guest declined';
      } else if(!sideSelect.value){
        tableSelect.disabled = true;
        tableSelect.value = '';
        tableSelect.title = 'Choose a relation first';
      } else {
        tableSelect.disabled = false;
        tableSelect.title = '';
      }
    }
    populateCategories(data.category || '');
    populateTables();
    sideSelect.addEventListener('change', ()=>{
      data.side = sideSelect.value || '';
      data.category = '';
      populateCategories('');
      populateTables();
      markDirty(key, tr);
    });
    categorySelect.addEventListener('change', ()=>{
      data.category = categorySelect.value || '';
      populateTables();
      markDirty(key, tr);
    });
    tableSelect.addEventListener('change', ()=>{
      const val = parseInt(tableSelect.value, 10) || null;
      if(val){
        const capacity = getTableCapacity(val);
        const others = getTableHeadcount(val, key);
        const thisHeadcount = 1 + (data.attending==='yes' && data.plusOne==='yes' ? 1 : 0);
        if(others + thisHeadcount > capacity){
          alert(`Table ${val} would have ${others + thisHeadcount} guests, but it only seats ${capacity}. Merge it with another table first, or choose a different table.`);
          tableSelect.value = data.tableNumber || '';
          return;
        }
      }
      data.tableNumber = val;
      markDirty(key, tr);
    });

    // Shared by the row's own Save button and "Save All". opts.silent
    // suppresses the alert on failure so Save All can batch one summary
    // instead of a popup per row.
    async function saveRow(opts){
      const silent = opts && opts.silent;
      if(data.plusOne === 'yes' && !data.plusOneName){
        if(!silent) alert("Please enter the +1's name, or set their +1 to \"No +1\".");
        return { ok:false, reason:"missing +1 name" };
      }
      btn.textContent = 'Saving…';
      try{
        await db.collection(COLLECTION).doc(key).set({
          value: JSON.stringify(data), shared: true, updatedAt: Date.now()
        });
        btn.textContent = 'Saved ✓';
        clearDirty(key, tr);
        renderStats();
        renderChart();
        renderSeating();
        setTimeout(()=>{ btn.textContent = 'Save'; }, 1400);
        return { ok:true };
      }catch(err){
        btn.textContent = 'Error';
        console.error(err);
        return { ok:false, reason:'network error' };
      }
    }
    rowSavers.set(key, saveRow);
    btn.addEventListener('click', ()=> saveRow());

    delBtn.addEventListener('click', async ()=>{
      const ok = window.confirm(`Delete ${data.name}'s RSVP? This cannot be undone.`);
      if(!ok) return;
      delBtn.textContent = '…';
      delBtn.disabled = true;
      try{
        await db.collection(COLLECTION).doc(key).delete();
        allEntries = allEntries.filter(e => e.key !== key);
        dirtyKeys.delete(key);
        rowSavers.delete(key);
        selectedKeys.delete(key);
        updateSaveAllButton();
        renderStats();
        renderChart();
        renderSeating();
        renderTable();
      }catch(err){
        delBtn.textContent = '🗑';
        delBtn.disabled = false;
        console.error(err);
      }
    });

    tbody.appendChild(tr);
  });
  refreshSelectAllState();
  updateBulkBar();
  scroll.appendChild(tbl);
  wrap.innerHTML = '';
  wrap.appendChild(scroll);

  tbl.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if(sortState.key === key){ sortState.dir *= -1; }
      else { sortState = { key, dir: 1 }; }
      renderTable();
    });
  });
}
</script>
