<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nancy &amp; Marc — October 24</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  @font-face {
    font-family: 'Orange Avenue';
    src: url('fonts/OrangeAvenueDEMO-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    /* Palette lifted directly from the invitation artwork */
    --ink: #56226B;         /* deep plum text */
    --accent: #7A743F;      /* olive/gold ampersand accent */
    --lavender: #CBBCDB;    /* pill / border lavender */
    --lavender-deep: #A88FC0;
    --cream: #FDF2F0;       /* card paper */
    --tile-black: #141115;
    --tile-black-2: #2b2630;
    --tile-cream: #F8ECE7;
    --page-bg: #E9DCE6;
    --focus: #7A5C9E;
    --e: cubic-bezier(.22,.61,.36,1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: 'Orange Avenue', Georgia, 'Times New Roman', serif;
  }

  body {
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-inline: 16px;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .invite-page {
    width: 100%;
    max-width: 640px;
  }

  .invite-wrap {
    position: relative;
    width: 100%;
    container-type: inline-size;
    container-name: invite;
    line-height: 0;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(60, 30, 70, 0.55);
  }

  .invite-wrap img.bg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ---------- shared overlay helpers ---------- */
  .hit {
    position: absolute;
    display: block;
    cursor: pointer;
  }

  a.hit { -webkit-tap-highlight-color: rgba(122, 92, 158, 0.25); }

  .hit:focus-visible,
  input.field:focus-visible,
  button.submit-hit:focus-visible {
    outline: 2.2cqw solid var(--focus);
    outline-offset: 1px;
    border-radius: 2cqw;
  }

  /* ---------- text-style overlay elements ---------- */
  .field {
    position: absolute;
    border: none;
    background: transparent;
    padding: 0 1cqw;
    font-family: 'Orange Avenue', Georgia, serif;
    color: var(--ink);
  }
  .field::placeholder { color: rgba(86, 34, 107, 0.32); }
  .field:focus { outline: none; background: rgba(203, 188, 219, 0.18); border-radius: 2cqw; }

  /* radio hit areas */
  .radio-hit { position: absolute; display: block; }
  .radio-hit input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .radio-dot { position: absolute; left: 0; border-radius: 50%; pointer-events: none; }
  .radio-dot::after {
    content: ''; position: absolute; inset: 24%; border-radius: 50%;
    background: var(--ink); transform: scale(0); transition: transform 0.16s ease;
  }
  .radio-hit input:checked ~ .radio-dot::after { transform: scale(1); }

  /* submit button hit area */
  .submit-hit {
    position: absolute; background: transparent; border: none; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .submit-hit:active { transform: scale(0.98); }
  .submit-hit:disabled { cursor: default; opacity: 0.6; }

  /* hidden admin tap target */
  .admin-hit { position: absolute; background: transparent; border: none; padding: 0; }

  /* ---------- countdown ---------- */
  .countdown {
    position: absolute;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .cd-group { display: flex; flex-direction: column; align-items: center; gap: 2cqw; flex: 1 1 0; }
  .cd-tiles { display: flex; gap: 0.7cqw; }
  .cd-tile {
    position: relative;
    width: 7.2cqw; height: 9.6cqw;
    background: linear-gradient(180deg, rgba(122,92,158,0.92) 0%, rgba(90,45,113,0.94) 55%, rgba(69,26,89,0.96) 100%);
    -webkit-backdrop-filter: blur(3px) saturate(115%);
    backdrop-filter: blur(3px) saturate(115%);
    border: 1px solid rgba(253,242,240,0.35);
    border-radius: 0.9cqw;
    box-shadow: 0 0.6cqw 1.4cqw rgba(45,20,55,0.28);
    overflow: hidden;
  }
  .cd-tile::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: rgba(253,242,240,0.4);
  }
  .cd-tile span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Orange Avenue', Georgia, serif;
    font-variant-numeric: tabular-nums;
    font-size: 6.4cqw; color: #FFFFFF;
    transition: opacity 0.18s ease;
  }
  .cd-tile.flip span { animation: cdflip 0.5s ease; }
  @keyframes cdflip {
    0% { transform: rotateX(0deg); opacity: 1; }
    45% { transform: rotateX(-90deg); opacity: 0.35; }
    55% { transform: rotateX(90deg); opacity: 0.35; }
    100% { transform: rotateX(0deg); opacity: 1; }
  }
  .cd-label {
    font-size: 2.7cqw; line-height: 1.4; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink); opacity: 0.85; white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .cd-tile.flip span { animation: none; }
    .submit-hit:active { transform: none; }
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px) + 14px);
    transform: translate(-50%, 12px);
    background: var(--ink); color: var(--cream);
    font-family: 'Orange Avenue', Georgia, serif; font-size: 15px; line-height: 1.4;
    padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,0.45);
    max-width: min(90vw, 420px); text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- RSVP confirmation modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(41, 20, 51, 0.5);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 30;
  }
  .modal-backdrop.show { display: flex; }
  .confirm-modal {
    position: relative;
    width: 100%; max-width: 380px;
    background: var(--cream);
    border: 1px solid var(--lavender-deep);
    border-radius: 20px;
    padding: 30px 26px 26px;
    text-align: center;
    box-shadow: 0 30px 70px -20px rgba(30, 10, 40, 0.55);
    font-family: 'Orange Avenue', Georgia, serif;
    color: var(--ink);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }
  .confirm-modal h3 { margin: 0 0 10px; font-size: 26px; font-weight: 400; }
  .confirm-modal p { margin: 0 0 16px; font-size: 16px; line-height: 1.5; }
  .modal-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; font-size: 22px; line-height: 1;
    color: var(--ink); opacity: 0.55; cursor: pointer; padding: 6px;
  }
  .modal-close:hover { opacity: 1; }
  .cal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .cal-pill {
    display: inline-block; background: var(--lavender); color: var(--ink);
    text-decoration: none; font-size: 14px; padding: 9px 18px; border-radius: 999px;
    letter-spacing: 0.02em; transition: background 0.15s ease;
    border: none; cursor: pointer; font-family: 'Orange Avenue', Georgia, serif;
  }
  .cal-pill:hover { background: var(--lavender-deep); }

  /* on-page "Add to Calendar" links, styled like the underlined baked-in links */
  .cal-link {
    position: absolute; background: none; border: none; padding: 0; margin: 0;
    font-family: 'Orange Avenue', Georgia, serif; color: var(--ink);
    text-decoration: underline; cursor: pointer; text-align: center;
    white-space: nowrap; opacity: 0.92;
  }
  .cal-link:hover { opacity: 1; }
  .confirm-qr { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .table-label { font-size: 14px; opacity: 0.85; max-width: 260px; }
  #qr-canvas-wrap { padding: 10px; background: #fff; border-radius: 10px; line-height: 0; }

  /* ---------- admin overlay (functional, lightly themed) ---------- */
  #admin-overlay {
    position: fixed; inset: 0; background: rgba(30, 15, 38, 0.75);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 40; overflow-y: auto;
  }
  #admin-overlay.show { display: flex; }
  .admin-wrap {
    position: relative; width: 100%; max-width: 760px;
    background:
      radial-gradient(120% 140% at 12% -10%, rgba(203,188,219,0.35) 0%, rgba(203,188,219,0) 55%),
      var(--cream);
    border: 1px solid rgba(168,143,192,0.45);
    border-radius: 18px; padding: 32px 28px 28px;
    font-family: Georgia, serif; color: var(--ink);
    box-shadow: 0 30px 70px -20px rgba(30, 10, 40, 0.5);
  }
  .admin-wrap h2 {
    font-family: 'Orange Avenue', Georgia, serif; font-weight: 400;
    margin: 0; font-size: 26px; letter-spacing: 0.01em;
  }
  .admin-header { margin-bottom: 8px; }
  .admin-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 10px 0 22px; color: var(--lavender-deep);
  }
  .admin-divider::before, .admin-divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--lavender-deep) 50%, transparent);
    opacity: 0.7;
  }
  .admin-divider::before { background: linear-gradient(90deg, var(--lavender-deep), transparent); }
  .admin-divider::after { background: linear-gradient(90deg, transparent, var(--lavender-deep)); }
  .admin-divider svg { flex: none; display: block; width: 13px; height: 13px; }
  .admin-close {
    position: absolute; top: 16px; right: 18px; background: none;
    border: 1px solid var(--lavender-deep); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .admin-close:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  .admin-summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; font-size: 14px; }
  .admin-summary .stat-tile {
    display: flex; align-items: center; gap: 10px;
    background: var(--lavender); padding: 10px 16px; border-radius: 12px;
    border: 1px solid rgba(168,143,192,0.5);
  }
  .stat-tile .stat-icon {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(253,242,240,0.6); color: var(--ink);
  }
  .stat-tile .stat-icon svg { width: 16px; height: 16px; }
  .admin-summary b { display: block; font-size: 19px; line-height: 1.15; }
  .admin-summary .stat-label { opacity: 0.75; font-size: 12.5px; }
  .admin-loading { opacity: 0.7; font-size: 14px; }

  /* ---------- admin guest-status chart ---------- */
  .admin-chart {
    margin: 0 0 24px; background: rgba(253,242,240,0.55);
    border: 1px solid rgba(168,143,192,0.35); border-radius: 12px; padding: 14px 16px 16px;
  }
  .admin-chart-title {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink); opacity: 0.7; margin: 0 0 10px;
  }
  .admin-chart-title svg { width: 13px; height: 13px; flex: none; }
  .chart-bar {
    display: flex; gap: 2px; width: 100%; height: 22px;
    border-radius: 11px; overflow: hidden;
    background: var(--cream); border: 1px solid rgba(86,34,107,0.18);
  }
  .chart-seg { height: 100%; }
  .chart-seg.seated   { background: #4a3aa7; }
  .chart-seg.awaiting { background: #eda100; }
  .chart-seg.declined { background: #e34948; }
  .chart-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
  .chart-legend-item { display: flex; align-items: center; gap: 7px; }
  .chart-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chart-legend-item b { font-weight: 700; }
  .chart-legend-item.seated   .chart-legend-dot { background: #4a3aa7; }
  .chart-legend-item.awaiting .chart-legend-dot { background: #eda100; }
  .chart-legend-item.declined .chart-legend-dot { background: #e34948; }

  /* ---------- admin search ---------- */
  .admin-toolbar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .admin-search {
    position: relative; flex: 1; max-width: 280px;
  }
  .admin-search svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--ink); opacity: 0.55; pointer-events: none;
  }
  .admin-search input {
    width: 100%; box-sizing: border-box; font-family: Georgia, serif;
    border: 1px solid var(--lavender-deep); border-radius: 999px;
    padding: 8px 14px 8px 32px; font-size: 13.5px; color: var(--ink);
    background: var(--cream);
  }
  .admin-search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .admin-count { font-size: 12.5px; opacity: 0.65; white-space: nowrap; }

  /* ---------- guest table ---------- */
  .admin-table-scroll {
    max-height: 46vh; overflow-y: auto; border-radius: 10px;
    border: 1px solid rgba(168,143,192,0.35);
  }
  table.guest-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.guest-table thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px;
    color: var(--ink); background: var(--lavender);
    border-bottom: 1px solid var(--lavender-deep); padding: 9px 10px;
  }
  table.guest-table th svg { width: 12px; height: 12px; vertical-align: -2px; margin-right: 3px; }
  table.guest-table th.sortable { cursor: pointer; user-select: none; }
  table.guest-table th.sortable:hover { background: var(--lavender-deep); color: var(--cream); }
  table.guest-table th .sort-arrow { display: inline-block; margin-left: 3px; opacity: 0.55; font-size: 10px; }
  table.guest-table th.sort-active .sort-arrow { opacity: 1; }
  table.guest-table tbody tr:nth-child(even) td { background: rgba(168,143,192,0.09); }
  table.guest-table tbody tr:hover td { background: rgba(168,143,192,0.2); }
  table.guest-table td { padding: 9px 10px; border-bottom: 1px solid rgba(168,143,192,0.35); }
  table.guest-table tbody tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
    letter-spacing: 0.01em; white-space: nowrap;
  }
  .badge svg { width: 10px; height: 10px; flex: none; }
  .badge.yes { background: rgba(74,58,167,0.14); color: #4a3aa7; }
  .badge.no  { background: rgba(227,73,72,0.13); color: #b5342f; }
  .badge.guest { background: rgba(122,116,63,0.15); color: var(--accent); }
  .badge.muted { background: rgba(86,34,107,0.08); color: var(--ink); opacity: 0.55; }

  .table-cell { display: flex; align-items: center; gap: 8px; }
  .table-cell svg { width: 14px; height: 14px; flex: none; opacity: 0.6; }
  table.guest-table input[type=number] {
    width: 60px; border: 1px solid var(--lavender-deep); padding: 5px 7px; border-radius: 6px;
    font-family: Georgia, serif; color: var(--ink);
  }
  table.guest-table input[type=number]:not(:placeholder-shown):not([value=""]) {
    border-color: #4a3aa7;
  }
  table.guest-table button.save-row {
    background: none; border: 1px solid var(--ink); color: var(--ink);
    font-size: 11px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  table.guest-table button.save-row:hover:not(:disabled) { background: var(--ink); color: var(--cream); }
  table.guest-table button.save-row:disabled { opacity: 0.4; cursor: default; }
  .admin-empty { padding: 22px 10px; text-align: center; opacity: 0.65; font-size: 14px; }

  /* ---------- entrance seal ---------- */
  #dust {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0; transition: opacity 1.6s 0.2s ease;
  }
  body.invite-opened #dust { opacity: 1; }

  .invite-page { position: relative; z-index: 2; }

  .seal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 80% at 50% 22%, #f6ecf4 0%, var(--page-bg) 62%, #d9c4d6 100%);
    padding: 24px 16px;
    cursor: pointer;
    transition: opacity 1s var(--e, ease), transform 1.2s var(--e, ease), visibility 1s;
  }
  .seal::after {
    content: '';
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px;
    margin: -5px 0 0 -5px; border-radius: 50%;
    background: radial-gradient(circle, rgba(203, 188, 219, 0.95), rgba(203, 188, 219, 0) 70%);
    transform: scale(0); opacity: 0; pointer-events: none;
  }
  .seal.go { opacity: 0; transform: scale(1.08); visibility: hidden; }
  .seal.go::after { animation: sealBloom 0.9s var(--e, ease) forwards; }
  @keyframes sealBloom { 0% { transform: scale(0); opacity: 0.9; } 100% { transform: scale(160); opacity: 0; } }

  .seal-in { width: 100%; max-width: 400px; text-align: center; }

  .seal-frame {
    position: relative;
    margin: 0 auto 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .seal-doves-img {
    display: block;
    width: min(56vw, 224px);
    height: auto;
    opacity: 0;
    transform: scale(0.92);
    animation: sealArtIn 1s 0.15s var(--e, ease) forwards;
  }
  @keyframes sealArtIn { to { opacity: 1; transform: scale(1); } }

  .seal-monogram-img {
    display: block;
    width: min(34vw, 136px);
    height: auto;
    margin-top: 2px;
    opacity: 0;
    transform: translateY(10px);
    animation: sealMonoIn 0.8s 0.9s var(--e, ease) forwards;
  }
  @keyframes sealMonoIn { to { opacity: 1; transform: none; } }

  .seal-names-img {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.2vw;
    margin: 6px 0 10px;
    opacity: 0;
    transform: translateY(10px);
    animation: sealFadeUpImg 0.8s 1.1s var(--e, ease) forwards;
  }
  .seal-names-img img { display: block; width: auto; }
  .seal-names-img .nm-nancy, .seal-names-img .nm-marc { height: min(11vw, 46px); }
  .seal-names-img .nm-amp { height: min(9vw, 38px); }
  @keyframes sealFadeUpImg { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .seal-tagline {
    margin: 0 0 26px;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: var(--ink);
    opacity: 0;
    animation: sealFadeUp 0.8s 1.25s var(--e, ease) forwards;
  }
  @keyframes sealFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.85; transform: none; } }

  .seal-hint {
    display: inline-block;
    border: 0; background: none; cursor: pointer;
    font-family: 'Orange Avenue', Georgia, serif;
    font-size: 16px; letter-spacing: 0.04em;
    color: var(--ink);
    padding: 8px 4px 0;
    opacity: 0;
    animation: sealFadeUp2 0.9s 1.6s var(--e, ease) forwards;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes sealFadeUp2 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .seal-hint::after {
    content: '';
    display: block;
    width: 26px; height: 1px;
    margin: 10px auto 0;
    background: var(--lavender-deep);
    animation: sealBreathe 2.6s 2.5s ease-in-out infinite;
  }
  @keyframes sealBreathe { 0%, 100% { width: 26px; opacity: 0.5; } 50% { width: 60px; opacity: 1; } }

  body.entrance-lock { overflow: hidden; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    .seal, .seal-doves-img, .seal-monogram-img, .seal-names-img, .seal-tagline, .seal-hint {
      animation: none !important;
      transition: none !important;
    }
    .seal-doves-img, .seal-monogram-img, .seal-names-img { opacity: 1; transform: none; }
    .seal-tagline, .seal-hint { opacity: 1; transform: none; }
  }
</style>
</head>
<body class="entrance-lock">

<div class="seal" id="seal">
  <div class="seal-in">
    <div class="seal-frame">
      <img class="seal-doves-img" src="images/dove_pair.png" alt="Two doves" width="1291" height="593">
      <img class="seal-monogram-img" src="images/monogram.png" alt="Nancy and Marc's monogram" width="1223" height="865">
    </div>
    <div class="seal-names-img" role="heading" aria-level="1" aria-label="Nancy &amp; Marc">
      <img class="nm-nancy" src="images/name_nancy.png" alt="" aria-hidden="true" width="1004" height="409">
      <img class="nm-amp" src="images/name_amp.png" alt="" aria-hidden="true" width="321" height="361">
      <img class="nm-marc" src="images/name_marc.png" alt="" aria-hidden="true" width="944" height="327">
    </div>
    <p class="seal-tagline">are getting married</p>
    <button type="button" class="seal-hint" id="entranceOpenBtn">Tap to open the invitation</button>
  </div>
</div>

<script>
  (function(){
    // Always start a fresh visit (including a refresh mid-scroll) at the very
    // top of the invitation, rather than wherever the browser last had the
    // page scrolled to.
    if('scrollRestoration' in history){ history.scrollRestoration = 'manual'; }
    window.scrollTo(0, 0);

    var seal = document.getElementById('seal');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!seal){ document.body.classList.remove('entrance-lock'); return; }
    var opened = false;
    function open(){
      if(opened) return;
      opened = true;
      window.scrollTo(0, 0);
      seal.classList.add('go');
      document.body.classList.remove('entrance-lock');
      document.body.classList.add('invite-opened');
      setTimeout(function(){ if(seal.parentNode) seal.parentNode.removeChild(seal); }, 1300);
      startDust();
    }
    seal.addEventListener('click', open);
    if(reduce) setTimeout(open, 900);

    var dustStarted = false;
    function startDust(){
      if(dustStarted || reduce) return;
      dustStarted = true;
      var c = document.getElementById('dust');
      if(!c || !c.getContext) return;
      var x = c.getContext('2d'), W, H, ps = [];
      function size(){
        var r = Math.min(window.devicePixelRatio || 1, 2);
        W = c.width = innerWidth * r; H = c.height = innerHeight * r;
        c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
        x.setTransform(r, 0, 0, r, 0, 0);
      }
      size();
      addEventListener('resize', size);
      var N = innerWidth < 520 ? 14 : 24;
      for(var i = 0; i < N; i++){
        ps.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 1.4 + 0.5,
          v: Math.random() * 0.14 + 0.05,
          w: Math.random() * 0.5 + 0.15,
          p: Math.random() * Math.PI * 2,
          o: Math.random() * 0.2 + 0.06
        });
      }
      (function loop(){
        x.clearRect(0, 0, innerWidth, innerHeight);
        for(var i = 0; i < ps.length; i++){
          var p = ps[i];
          p.y -= p.v; p.p += 0.008;
          if(p.y < -8){ p.y = innerHeight + 8; p.x = Math.random() * innerWidth; }
          x.beginPath();
          x.arc(p.x + Math.sin(p.p) * 14, p.y, p.r, 0, 6.284);
          x.fillStyle = 'rgba(122,116,63,' + (p.o * (0.6 + 0.4 * Math.sin(p.p * 1.7))).toFixed(3) + ')';
          x.fill();
        }
        requestAnimationFrame(loop);
      })();
    }
  })();
</script>

<script>
// ---------- Firebase setup (unchanged from the existing backend) ----------
const firebaseConfig = {
  apiKey: "AIzaSyCtiGIjE_avSstphgp7uo8XX2A4bPMHw3g",
  authDomain: "nancy-marc-wedding.firebaseapp.com",
  projectId: "nancy-marc-wedding",
  storageBucket: "nancy-marc-wedding.firebasestorage.app",
  messagingSenderId: "390527284227",
  appId: "1:390527284227:web:51f20657d4e95c2be08a36"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'wedding_data';

// Same get/set/delete/list shim as before, unchanged.
window.storage = {
  async get(key, shared){
    const doc = await db.collection(COLLECTION).doc(key).get();
    if(!doc.exists) throw new Error('Key not found: ' + key);
    return { key, value: doc.data().value, shared: !!shared };
  },
  async set(key, value, shared){
    await db.collection(COLLECTION).doc(key).set({
      value, shared: !!shared, updatedAt: Date.now()
    });
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    await db.collection(COLLECTION).doc(key).delete();
    return { key, deleted:true, shared: !!shared };
  },
  async list(prefix, shared){
    const snap = await db.collection(COLLECTION).get();
    const keys = [];
    snap.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
    return { keys, prefix, shared: !!shared };
  }
};

(function(){
  "use strict";

  // ---------- helpers (unchanged) ----------
  function slugify(name){
    return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }
  // Enforce "Mark Adel Ragheb"-style capitalization on names: first letter
  // of each word (and each hyphen/apostrophe-separated chunk within it)
  // uppercase, the rest lowercase — regardless of how the guest typed it.
  function toTitleCase(str){
    return str.trim().replace(/\s+/g,' ').split(' ').map(function(word){
      return word.replace(/[A-Za-z]+/g, function(chunk){
        return chunk.charAt(0).toUpperCase() + chunk.slice(1).toLowerCase();
      });
    }).join(' ');
  }
  function fmtICSDate(d){
    return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  }

  // .ics generation replaces the old Google-Calendar-only link: a calendar
  // "TEMPLATE" URL has no way to attach a reminder, and .ics works the same
  // way across Google Calendar, Apple Calendar and Outlook via one file.
  function icsEscape(text){
    return String(text).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  }
  function buildICS({title, details, location, start, end, reminderMinutes}){
    const uid = Date.now() + '-' + Math.random().toString(36).slice(2) + '@nancy-marc-wedding';
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Nancy & Marc Wedding//EN',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + uid,
      'DTSTAMP:' + fmtICSDate(new Date()),
      'DTSTART:' + fmtICSDate(start),
      'DTEND:' + fmtICSDate(end),
      'SUMMARY:' + icsEscape(title),
      'DESCRIPTION:' + icsEscape(details),
      'LOCATION:' + icsEscape(location)
    ];
    if(reminderMinutes){
      lines.push(
        'BEGIN:VALARM',
        'ACTION:DISPLAY',
        'DESCRIPTION:Reminder',
        'TRIGGER:-PT' + reminderMinutes + 'M',
        'END:VALARM'
      );
    }
    lines.push('END:VEVENT', 'END:VCALENDAR');
    return lines.join('\r\n');
  }
  function downloadICS(filename, cal){
    const blob = new Blob([buildICS(cal)], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Egypt reinstated DST in 2023 (clocks forward late April, back late October),
  // and Oct 24 2026 falls inside that window — Cairo is UTC+3 (EEST) on the
  // wedding date, not the UTC+2 (EET) it uses the rest of the year. Times
  // below are given in UTC directly, pre-converted from the intended Cairo
  // wall-clock times using that +3 offset.
  const YEAR = 2026;
  const churchStart = new Date(Date.UTC(YEAR,9,24,13,0));  // 16:00 Cairo (4:00 PM)
  const churchEnd   = new Date(Date.UTC(YEAR,9,24,14,0));  // 17:00 Cairo (5:00 PM)
  const recStart    = new Date(Date.UTC(YEAR,9,24,14,30)); // 17:30 Cairo (5:30 PM)
  const recEnd      = new Date(Date.UTC(YEAR,9,24,19,30)); // 22:30 Cairo (10:30 PM)

  const LIVESTREAM_URL = "https://www.youtube.com/watch?v=KPPSCLWU6KE";

  const churchCal = {
    title:"Nancy & Marc's Wedding Ceremony",
    details:"Ceremony at St. Mark Coptic Orthodox Church, Cleopatra, Heliopolis.\nCan't join in person? Watch live: " + LIVESTREAM_URL,
    location:"St. Mark Coptic Orthodox Church, Cleopatra, Heliopolis, Cairo",
    start:churchStart, end:churchEnd,
    reminderMinutes: 15
  };
  const receptionCal = {
    title:"Nancy & Marc's Wedding Reception",
    details:"Reception at The Garden, located inside Hilton Cairo Heliopolis.",
    location:"The Garden at Hilton Cairo Heliopolis, Cairo",
    start:recStart, end:recEnd,
    reminderMinutes: 15
  };

  document.getElementById('calChurchLink').addEventListener('click', () => downloadICS('ceremony.ics', churchCal));
  document.getElementById('calReceptionLink').addEventListener('click', () => downloadICS('reception.ics', receptionCal));

  /* ---------------- live countdown (target unchanged: ceremony start) ---------------- */
  const TARGET = churchStart.getTime();
  const slots = {};
  ["d0","d1","h0","h1","m0","m1","s0","s1"].forEach(function (key) {
    slots[key] = document.querySelector('.cd-tile[data-slot="' + key + '"]');
  });
  const announce = document.getElementById("countdownAnnounce");
  let lastAnnounceMinute = null;

  function setTile(el, digit) {
    const span = el.querySelector("span");
    if (span.textContent !== digit) {
      span.textContent = digit;
      el.classList.remove("flip");
      void el.offsetWidth;
      el.classList.add("flip");
    }
  }

  function tickCountdown() {
    const diff = Math.max(0, TARGET - Date.now());
    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const dd = String(Math.min(days, 99)).padStart(2, "0");
    const hh = String(hours).padStart(2, "0");
    const mm = String(minutes).padStart(2, "0");
    const ss = String(seconds).padStart(2, "0");

    setTile(slots.d0, dd[0]); setTile(slots.d1, dd[1]);
    setTile(slots.h0, hh[0]); setTile(slots.h1, hh[1]);
    setTile(slots.m0, mm[0]); setTile(slots.m1, mm[1]);
    setTile(slots.s0, ss[0]); setTile(slots.s1, ss[1]);

    if (minutes !== lastAnnounceMinute) {
      lastAnnounceMinute = minutes;
      announce.textContent = days + " days, " + hours + " hours and " + minutes + " minutes to go.";
    }
  }
  tickCountdown();
  setInterval(tickCountdown, 1000);

  /* ---------------- toast ---------------- */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 4200);
  }

  /* ---------------- RSVP form (same data shape + Firestore logic as the existing backend) ---------------- */
  const form = document.getElementById("rsvpForm");
  const submitBtn = document.getElementById("submitBtn");
  const guestNameField = document.getElementById("guestName");
  const fullNameField = document.getElementById("fullName");

  // Auto-capitalize names as the guest fills the form in (not just at
  // submit time), so what they see matches what gets saved.
  fullNameField.addEventListener('blur', function(){
    if(this.value.trim()) this.value = toTitleCase(this.value);
  });
  guestNameField.addEventListener('blur', function(){
    if(this.value.trim()) this.value = toTitleCase(this.value);
  });

  // Guest's name only makes sense — and only shows — when "Yes" is picked
  // for the +1 question. Switching back to "No" hides and clears it, so a
  // leftover typed name can never be saved against a "no guest" RSVP.
  function updateGuestNameVisibility(){
    const wantsGuest = (form.querySelector('input[name="plusOne"]:checked') || {}).value === 'yes';
    guestNameField.hidden = !wantsGuest;
    if(!wantsGuest) guestNameField.value = '';
  }
  form.querySelectorAll('input[name="plusOne"]').forEach(function(radio){
    radio.addEventListener('change', updateGuestNameVisibility);
  });

  async function safeGet(key){
    try{ return await window.storage.get(key, true); }
    catch(_){ return null; }
  }

  function renderQR(containerId, data){
    const box = document.getElementById(containerId);
    box.innerHTML = '';
    if(data.attending !== 'yes'){ return; }
    if(data.tableNumber){
      const wrap = document.createElement('div');
      wrap.id = 'qr-canvas-wrap-' + containerId;
      box.appendChild(wrap);
      new QRCode(wrap, {
        text:`Nancy & Marc Wedding\n${data.name}\nTable ${data.tableNumber}`,
        width:160, height:160,
        colorDark:"#33163F", colorLight:"#FFFFFF"
      });
      const lbl = document.createElement('div');
      lbl.className = 'table-label';
      lbl.textContent = `Table ${data.tableNumber}`;
      box.appendChild(lbl);
    }
  }

  const confirmBackdrop = document.getElementById('confirmBackdrop');
  document.getElementById('confirmClose').addEventListener('click', function(){
    confirmBackdrop.classList.remove('show');
  });

  function showConfirm(data, mode){
    // mode: undefined/'new' -> fresh RSVP, 'update' -> details changed,
    // 'existing' -> they already exist in our database and nothing changed
    document.getElementById('confirmName').textContent = ', ' + data.name.split(' ')[0];
    let msg;
    if(data.attending === 'yes'){
      msg = data.plusOne === 'yes'
        ? `We can't wait to celebrate with you and ${data.plusOneName || 'your guest'}.`
        : `We can't wait to celebrate with you.`;
    } else {
      msg = `You'll be missed — thank you for letting us know.`;
    }
    if(mode === 'update'){
      msg = `We've updated your RSVP. ` + msg;
    } else if(mode === 'existing'){
      msg = `Looks like you're already on our list — no changes needed! ` + msg;
    }
    document.getElementById('confirmMsg').textContent = msg;
    const calWrap = document.getElementById('confirmCal');
    calWrap.innerHTML = '';
    if(data.attending === 'yes'){
      calWrap.innerHTML = `
        <button type="button" class="cal-pill" id="confirmCalChurch">+ Ceremony</button>
        <button type="button" class="cal-pill" id="confirmCalReception">+ Reception</button>
      `;
      document.getElementById('confirmCalChurch').addEventListener('click', () => downloadICS('ceremony.ics', churchCal));
      document.getElementById('confirmCalReception').addEventListener('click', () => downloadICS('reception.ics', receptionCal));
    }
    renderQR('qrBox', data);
    confirmBackdrop.classList.add('show');
  }

  // Every page load starts fresh (blank form, no auto-opened modal) — a
  // refresh behaves like a brand-new visitor. Returning-guest detection only
  // happens when they actually submit the form again below: we look their
  // name up in the database at that point and respond accordingly.

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = toTitleCase(document.getElementById('fullName').value.trim());
    document.getElementById('fullName').value = name;
    const attendingChoice = (form.querySelector('input[name="attending"]:checked') || {}).value;
    const plusOneChoice = (form.querySelector('input[name="plusOne"]:checked') || {}).value || 'no';
    const guestName = toTitleCase(document.getElementById('guestName').value.trim());
    document.getElementById('guestName').value = guestName;

    if(!name){
      showToast('Please enter your full name.');
      document.getElementById('fullName').focus();
      return;
    }
    if(name.split(/\s+/).filter(Boolean).length < 2){
      showToast('Please enter both your first and last name.');
      document.getElementById('fullName').focus();
      return;
    }
    if(!attendingChoice){
      showToast("Please let us know if you'll attend.");
      return;
    }
    const isAttending = attendingChoice === 'yes';
    if(isAttending && plusOneChoice === 'yes' && !guestName){
      showToast("Please enter your guest's name.");
      document.getElementById('guestName').focus();
      return;
    }
    if(isAttending && plusOneChoice === 'yes' && guestName.split(/\s+/).filter(Boolean).length < 2){
      showToast("Please enter your guest's first and last name.");
      document.getElementById('guestName').focus();
      return;
    }

    // The storage key is derived from a lower-cased, punctuation-stripped
    // slug of the name, so "Mark Adel", "mark adel" and "MARK   Adel" all
    // resolve to the exact same document — there is no separate duplicate
    // to create. We just need to look up that same document and either
    // (a) tell the person nicely that they're already on the list when
    // nothing changed, or (b) update their existing entry in place when
    // something did (e.g. they flipped from "no" to "yes", or added a +1).
    const key = 'rsvp:' + slugify(name);

    submitBtn.disabled = true;
    let existing = null;
    try { existing = await safeGet(key); } catch(_) {}

    let prevData = null;
    if(existing){
      try { prevData = JSON.parse(existing.value); } catch(_) {}
    }

    const data = {
      name,
      attending: isAttending ? 'yes' : 'no',
      plusOne: isAttending ? plusOneChoice : 'no',
      plusOneName: (isAttending && plusOneChoice === 'yes') ? guestName : '',
      tableNumber: prevData ? (prevData.tableNumber || null) : null,
      submittedAt: new Date().toLocaleString('en-GB', { timeZone:'Africa/Cairo', dateStyle:'medium', timeStyle:'medium' }) + ' (Cairo)',
      submittedAtMs: Date.now()
    };

    if(prevData){
      const unchanged =
        prevData.attending === data.attending &&
        prevData.plusOne === data.plusOne &&
        (prevData.plusOneName || '') === (data.plusOneName || '');
      if(unchanged){
        submitBtn.disabled = false;
        if(prevData.tableNumber){
          // Already registered AND a table has been assigned — show the
          // friendly confirm modal (with QR + table number) instead of a
          // plain toast, so they can see/save it again.
          showConfirm(prevData, 'existing');
        } else {
          // Already registered, nothing changed, no table yet — a quick,
          // friendly heads-up is enough.
          showToast(`Looks like we already have you on the list, ${name.split(' ')[0]} — no changes needed!`);
        }
        return;
      }
    }

    try {
      const result = await window.storage.set(key, JSON.stringify(data), true);
      if(!result){ throw new Error('save failed'); }
      showConfirm(data, prevData ? 'update' : 'new');
    } catch(err) {
      console.error(err);
      const detail = (err && (err.code || err.message)) || 'unknown error';
      showToast("Couldn't send (" + detail + ") — please try again.");
    } finally {
      submitBtn.disabled = false;
    }
  });

  /* ---------------- admin (unchanged behaviour from the existing backend) ---------------- */
  let tapCount = 0, tapTimer = null;
  document.getElementById('admin-trigger').addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 2500);
    if(tapCount >= 5){
      tapCount = 0;
      const pass = prompt('Admin passcode:');
      if(pass === 'MN2026'){ openAdmin(); }
    }
  });
  document.getElementById('admin-close').addEventListener('click', () => {
    document.getElementById('admin-overlay').classList.remove('show');
  });

  // ---- small inline icon set (stroke-based, currentColor, no external deps) ----
  const ICONS = {
    responses: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    xcircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    checkSmall: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    xSmall: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    guestPlus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>',
    seat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"/><path d="M4 10h16v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6z"/><line x1="6" y1="18" x2="6" y2="21"/><line x1="18" y1="18" x2="18" y2="21"/></svg>'
  };

  let adminEntries = [];
  let adminSort = { key: 'name', dir: 1 };
  let adminFilter = '';

  function renderAdminTable(){
    const tableWrap = document.getElementById('admin-table-wrap');
    const countEl = document.getElementById('admin-count');
    const q = adminFilter.trim().toLowerCase();
    const rows = adminEntries.filter(({data}) => {
      if(!q) return true;
      return data.name.toLowerCase().includes(q) ||
             (data.plusOneName || '').toLowerCase().includes(q);
    });

    const sorters = {
      name:   (e) => e.data.name.toLowerCase(),
      status: (e) => e.data.attending === 'yes' ? 0 : 1,
      table:  (e) => e.data.tableNumber || 9999
    };
    const sortFn = sorters[adminSort.key] || sorters.name;
    rows.sort((a, b) => {
      const av = sortFn(a), bv = sortFn(b);
      if(av < bv) return -1 * adminSort.dir;
      if(av > bv) return 1 * adminSort.dir;
      return a.data.name.localeCompare(b.data.name);
    });

    countEl.textContent = adminEntries.length
      ? `Showing ${rows.length} of ${adminEntries.length}`
      : '';

    if(adminEntries.length === 0){
      tableWrap.innerHTML = '<div class="admin-empty">No RSVPs yet.</div>';
      return;
    }
    if(rows.length === 0){
      tableWrap.innerHTML = '<div class="admin-empty">No guests match your search.</div>';
      return;
    }

    const arrow = (key) => adminSort.key === key ? (adminSort.dir === 1 ? '▲' : '▼') : '▲';
    const activeCls = (key) => adminSort.key === key ? 'sort-active' : '';

    const scroll = document.createElement('div');
    scroll.className = 'admin-table-scroll';
    const tbl = document.createElement('table');
    tbl.className = 'guest-table';
    tbl.innerHTML = `
      <thead><tr>
        <th class="sortable ${activeCls('name')}" data-sort="name">Name <span class="sort-arrow">${arrow('name')}</span></th>
        <th class="sortable ${activeCls('status')}" data-sort="status">Status <span class="sort-arrow">${arrow('status')}</span></th>
        <th>+1</th>
        <th class="sortable ${activeCls('table')}" data-sort="table">${ICONS.seat} Table <span class="sort-arrow">${arrow('table')}</span></th>
        <th></th>
      </tr></thead>
      <tbody></tbody>`;
    const tbody = tbl.querySelector('tbody');

    rows.forEach(({key, data}) => {
      const attending = data.attending === 'yes';
      const statusBadge = attending
        ? `<span class="badge yes">${ICONS.checkSmall}Attending</span>`
        : `<span class="badge no">${ICONS.xSmall}Declined</span>`;
      const plusOneBadge = (attending && data.plusOne === 'yes')
        ? `<span class="badge guest">${ICONS.guestPlus}${data.plusOneName || 'Guest'}</span>`
        : `<span class="badge muted">—</span>`;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${data.name}</td>
        <td>${statusBadge}</td>
        <td>${plusOneBadge}</td>
        <td><div class="table-cell"><input type="number" min="1" value="${data.tableNumber || ''}" ${!attending ? 'disabled' : ''}></div></td>
        <td><button class="save-row" ${!attending ? 'disabled' : ''}>Save</button></td>
      `;
      const input = tr.querySelector('input');
      const saveBtn = tr.querySelector('.save-row');
      saveBtn.addEventListener('click', async () => {
        const val = parseInt(input.value, 10);
        data.tableNumber = val || null;
        saveBtn.textContent = 'Saving…';
        try {
          await window.storage.set(key, JSON.stringify(data), true);
          saveBtn.textContent = 'Saved ✓';
          setTimeout(() => { saveBtn.textContent = 'Save'; }, 1500);
        } catch(_) {
          saveBtn.textContent = 'Error';
        }
      });
      tbody.appendChild(tr);
    });

    scroll.appendChild(tbl);
    tableWrap.innerHTML = '';
    tableWrap.appendChild(scroll);

    tbl.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if(adminSort.key === key){ adminSort.dir *= -1; }
        else { adminSort = { key, dir: 1 }; }
        renderAdminTable();
      });
    });
  }

  async function openAdmin(){
    const overlay = document.getElementById('admin-overlay');
    overlay.classList.add('show');
    const summaryEl = document.getElementById('admin-summary');
    const chartEl = document.getElementById('admin-chart');
    const tableWrap = document.getElementById('admin-table-wrap');
    const searchInput = document.getElementById('admin-search-input');
    summaryEl.innerHTML = '<span class="admin-loading">Loading responses…</span>';
    chartEl.innerHTML = '';
    tableWrap.innerHTML = '';
    document.getElementById('admin-count').textContent = '';
    searchInput.value = '';
    adminFilter = '';
    try {
      const list = await window.storage.list('rsvp:', true);
      const keys = (list && list.keys) || [];
      const entries = [];
      for(const k of keys){
        try {
          const r = await window.storage.get(k, true);
          if(r){
            const parsed = JSON.parse(r.value);
            if(parsed && typeof parsed.name === 'string') entries.push({key:k, data:parsed});
          }
        } catch(_) {}
      }
      entries.sort((a,b) => a.data.name.localeCompare(b.data.name));
      adminEntries = entries;

      const attendingCount = entries.filter(e => e.data.attending === 'yes').length;
      const plusOnes = entries.filter(e => e.data.attending === 'yes' && e.data.plusOne === 'yes').length;
      const declined = entries.filter(e => e.data.attending === 'no').length;
      const totalGuests = attendingCount + plusOnes;

      summaryEl.innerHTML = `
        <div class="stat-tile"><span class="stat-icon">${ICONS.responses}</span><div><b>${entries.length}</b><span class="stat-label">Responses</span></div></div>
        <div class="stat-tile"><span class="stat-icon">${ICONS.check}</span><div><b>${attendingCount}</b><span class="stat-label">Attending</span></div></div>
        <div class="stat-tile"><span class="stat-icon">${ICONS.users}</span><div><b>${totalGuests}</b><span class="stat-label">Total Guests</span></div></div>
        <div class="stat-tile"><span class="stat-icon">${ICONS.xcircle}</span><div><b>${declined}</b><span class="stat-label">Declined</span></div></div>
      `;

      // Guest-status breakdown, by headcount (a "yes" + their +1 counts as 2
      // guests) rather than by RSVP entry: seated (table assigned), awaiting
      // a table (attending, none assigned yet), and declined.
      const headcount = (data) => 1 + (data.attending === 'yes' && data.plusOne === 'yes' ? 1 : 0);
      let seatedGuests = 0, awaitingGuests = 0, declinedGuests = 0;
      entries.forEach(({data}) => {
        if(data.attending === 'yes' && data.tableNumber){ seatedGuests += headcount(data); }
        else if(data.attending === 'yes'){ awaitingGuests += headcount(data); }
        else { declinedGuests += headcount(data); }
      });
      const chartTotal = seatedGuests + awaitingGuests + declinedGuests;

      if(chartTotal === 0){
        chartEl.innerHTML = '';
      } else {
        const segs = [
          { cls: 'seated',   label: 'Seated',          count: seatedGuests },
          { cls: 'awaiting', label: 'Awaiting table',  count: awaitingGuests },
          { cls: 'declined', label: 'Declined',        count: declinedGuests }
        ].filter(s => s.count > 0);
        chartEl.innerHTML = `
          <div class="admin-chart-title">${ICONS.seat} Guests seated</div>
          <div class="chart-bar">
            ${segs.map(s => `<div class="chart-seg ${s.cls}" style="width:${(s.count/chartTotal*100).toFixed(2)}%"></div>`).join('')}
          </div>
          <div class="chart-legend">
            ${segs.map(s => `<div class="chart-legend-item ${s.cls}"><span class="chart-legend-dot"></span>${s.label}: <b>${s.count}</b></div>`).join('')}
          </div>
        `;
      }

      adminSort = { key: 'name', dir: 1 };
      renderAdminTable();
    } catch(err) {
      summaryEl.innerHTML = '<span class="admin-loading">Could not load responses.</span>';
      console.error(err);
    }
  }

  let adminSearchTimer = null;
  document.getElementById('admin-search-input').addEventListener('input', (e) => {
    clearTimeout(adminSearchTimer);
    const val = e.target.value;
    adminSearchTimer = setTimeout(() => { adminFilter = val; renderAdminTable(); }, 120);
  });
})();
</script>
</body>
</html>
