<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nancy &amp; Marc — October 24</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  @font-face {
    font-family: 'Orange Avenue';
    src: url('fonts/OrangeAvenueDEMO-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    /* Palette lifted directly from the invitation artwork */
    --ink: #56226B;         /* deep plum text */
    --accent: #7A743F;      /* olive/gold ampersand accent */
    --lavender: #CBBCDB;    /* pill / border lavender */
    --lavender-deep: #A88FC0;
    --cream: #FDF2F0;       /* card paper */
    --tile-black: #141115;
    --tile-black-2: #2b2630;
    --tile-cream: #F8ECE7;
    --page-bg: #E9DCE6;
    --focus: #7A5C9E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: 'Orange Avenue', Georgia, 'Times New Roman', serif;
  }

  body {
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-inline: 16px;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .invite-page {
    width: 100%;
    max-width: 640px;
  }

  .invite-wrap {
    position: relative;
    width: 100%;
    container-type: inline-size;
    container-name: invite;
    line-height: 0;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(60, 30, 70, 0.55);
  }

  .invite-wrap img.bg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ---------- shared overlay helpers ---------- */
  .hit {
    position: absolute;
    display: block;
    cursor: pointer;
  }

  a.hit { -webkit-tap-highlight-color: rgba(122, 92, 158, 0.25); }

  .hit:focus-visible,
  input.field:focus-visible,
  button.submit-hit:focus-visible {
    outline: 2.2cqw solid var(--focus);
    outline-offset: 1px;
    border-radius: 2cqw;
  }

  /* ---------- text-style overlay elements ---------- */
  .field {
    position: absolute;
    border: none;
    background: transparent;
    padding: 0 1cqw;
    font-family: 'Orange Avenue', Georgia, serif;
    color: var(--ink);
  }
  .field::placeholder { color: rgba(86, 34, 107, 0.32); }
  .field:focus { outline: none; background: rgba(203, 188, 219, 0.18); border-radius: 2cqw; }

  /* radio hit areas */
  .radio-hit { position: absolute; display: block; }
  .radio-hit input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .radio-dot { position: absolute; left: 0; border-radius: 50%; pointer-events: none; }
  .radio-dot::after {
    content: ''; position: absolute; inset: 24%; border-radius: 50%;
    background: var(--ink); transform: scale(0); transition: transform 0.16s ease;
  }
  .radio-hit input:checked ~ .radio-dot::after { transform: scale(1); }

  /* submit button hit area */
  .submit-hit {
    position: absolute; background: transparent; border: none; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .submit-hit:active { transform: scale(0.98); }
  .submit-hit:disabled { cursor: default; opacity: 0.6; }

  /* hidden admin tap target */
  .admin-hit { position: absolute; background: transparent; border: none; padding: 0; }

  /* ---------- countdown ---------- */
  .countdown {
    position: absolute;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .cd-group { display: flex; flex-direction: column; align-items: center; gap: 2cqw; flex: 1 1 0; }
  .cd-tiles { display: flex; gap: 0.7cqw; }
  .cd-tile {
    position: relative;
    width: 7.2cqw; height: 9.6cqw;
    background: linear-gradient(180deg, rgba(43,38,48,0.32) 0%, rgba(20,17,21,0.42) 55%, rgba(0,0,0,0.48) 100%);
    -webkit-backdrop-filter: blur(3px) saturate(115%);
    backdrop-filter: blur(3px) saturate(115%);
    border: 1px solid rgba(253,242,240,0.28);
    border-radius: 0.9cqw;
    box-shadow: 0 0.6cqw 1.4cqw rgba(45,20,55,0.22);
    overflow: hidden;
  }
  .cd-tile::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: rgba(253,242,240,0.35);
  }
  .cd-tile span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Orange Avenue', Georgia, serif;
    font-variant-numeric: tabular-nums;
    font-size: 6.4cqw; color: var(--tile-cream);
    transition: opacity 0.18s ease;
  }
  .cd-tile.flip span { animation: cdflip 0.5s ease; }
  @keyframes cdflip {
    0% { transform: rotateX(0deg); opacity: 1; }
    45% { transform: rotateX(-90deg); opacity: 0.35; }
    55% { transform: rotateX(90deg); opacity: 0.35; }
    100% { transform: rotateX(0deg); opacity: 1; }
  }
  .cd-label {
    font-size: 2.7cqw; line-height: 1.4; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink); opacity: 0.85; white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .cd-tile.flip span { animation: none; }
    .submit-hit:active { transform: none; }
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px) + 14px);
    transform: translate(-50%, 12px);
    background: var(--ink); color: var(--cream);
    font-family: 'Orange Avenue', Georgia, serif; font-size: 15px; line-height: 1.4;
    padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,0.45);
    max-width: min(90vw, 420px); text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- RSVP confirmation modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(41, 20, 51, 0.5);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 30;
  }
  .modal-backdrop.show { display: flex; }
  .confirm-modal {
    position: relative;
    width: 100%; max-width: 380px;
    background: var(--cream);
    border: 1px solid var(--lavender-deep);
    border-radius: 20px;
    padding: 30px 26px 26px;
    text-align: center;
    box-shadow: 0 30px 70px -20px rgba(30, 10, 40, 0.55);
    font-family: 'Orange Avenue', Georgia, serif;
    color: var(--ink);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }
  .confirm-modal h3 { margin: 0 0 10px; font-size: 26px; font-weight: 400; }
  .confirm-modal p { margin: 0 0 16px; font-size: 16px; line-height: 1.5; }
  .modal-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; font-size: 22px; line-height: 1;
    color: var(--ink); opacity: 0.55; cursor: pointer; padding: 6px;
  }
  .modal-close:hover { opacity: 1; }
  .cal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .cal-pill {
    display: inline-block; background: var(--lavender); color: var(--ink);
    text-decoration: none; font-size: 14px; padding: 9px 18px; border-radius: 999px;
    letter-spacing: 0.02em; transition: background 0.15s ease;
    border: none; cursor: pointer; font-family: 'Orange Avenue', Georgia, serif;
  }
  .cal-pill:hover { background: var(--lavender-deep); }

  /* on-page "Add to Calendar" links, styled like the underlined baked-in links */
  .cal-link {
    position: absolute; background: none; border: none; padding: 0; margin: 0;
    font-family: 'Orange Avenue', Georgia, serif; color: var(--ink);
    text-decoration: underline; cursor: pointer; text-align: center;
    white-space: nowrap; opacity: 0.92;
  }
  .cal-link:hover { opacity: 1; }
  .confirm-qr { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .table-label { font-size: 14px; opacity: 0.85; max-width: 260px; }
  #qr-canvas-wrap { padding: 10px; background: #fff; border-radius: 10px; line-height: 0; }

  /* ---------- admin overlay (functional, lightly themed) ---------- */
  #admin-overlay {
    position: fixed; inset: 0; background: rgba(30, 15, 38, 0.75);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 40; overflow-y: auto;
  }
  #admin-overlay.show { display: flex; }
  .admin-wrap {
    position: relative; width: 100%; max-width: 720px;
    background: var(--cream); border-radius: 14px; padding: 30px 24px;
    font-family: Georgia, serif; color: var(--ink);
  }
  .admin-wrap h2 { font-family: 'Orange Avenue', Georgia, serif; font-weight: 400; margin: 0 0 16px; }
  .admin-close {
    position: absolute; top: 14px; right: 16px; background: none;
    border: 1px solid var(--lavender-deep); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .admin-summary { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; font-size: 14px; }
  .admin-summary div { background: var(--lavender); padding: 8px 14px; border-radius: 10px; }
  .admin-summary b { display: block; font-size: 20px; }
  .admin-loading { opacity: 0.7; font-size: 14px; }
  table.guest-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.guest-table th {
    text-align: left; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px;
    color: var(--ink); opacity: 0.7; border-bottom: 1px solid var(--lavender-deep); padding: 8px 6px;
  }
  table.guest-table td { padding: 8px 6px; border-bottom: 1px solid rgba(168,143,192,0.35); }
  table.guest-table input[type=number] {
    width: 64px; border: 1px solid var(--lavender-deep); padding: 5px 7px; border-radius: 6px;
  }
  table.guest-table button.save-row {
    background: none; border: 1px solid var(--ink); color: var(--ink);
    font-size: 11px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  table.guest-table button.save-row:hover { background: var(--ink); color: var(--cream); }
</style>

<script>
// ---------- Firebase setup (unchanged from the existing backend) ----------
const firebaseConfig = {
  apiKey: "AIzaSyCtiGIjE_avSstphgp7uo8XX2A4bPMHw3g",
  authDomain: "nancy-marc-wedding.firebaseapp.com",
  projectId: "nancy-marc-wedding",
  storageBucket: "nancy-marc-wedding.firebasestorage.app",
  messagingSenderId: "390527284227",
  appId: "1:390527284227:web:51f20657d4e95c2be08a36"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'wedding_data';

// Same get/set/delete/list shim as before, unchanged.
window.storage = {
  async get(key, shared){
    const doc = await db.collection(COLLECTION).doc(key).get();
    if(!doc.exists) throw new Error('Key not found: ' + key);
    return { key, value: doc.data().value, shared: !!shared };
  },
  async set(key, value, shared){
    await db.collection(COLLECTION).doc(key).set({
      value, shared: !!shared, updatedAt: Date.now()
    });
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    await db.collection(COLLECTION).doc(key).delete();
    return { key, deleted:true, shared: !!shared };
  },
  async list(prefix, shared){
    const snap = await db.collection(COLLECTION).get();
    const keys = [];
    snap.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
    return { keys, prefix, shared: !!shared };
  }
};

(function(){
  "use strict";

  // ---------- helpers (unchanged) ----------
  function slugify(name){
    return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }
  function fmtICSDate(d){
    return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  }

  // .ics generation replaces the old Google-Calendar-only link: a calendar
  // "TEMPLATE" URL has no way to attach a reminder, and .ics works the same
  // way across Google Calendar, Apple Calendar and Outlook via one file.
  function icsEscape(text){
    return String(text).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  }
  function buildICS({title, details, location, start, end, reminderMinutes}){
    const uid = Date.now() + '-' + Math.random().toString(36).slice(2) + '@nancy-marc-wedding';
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Nancy & Marc Wedding//EN',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + uid,
      'DTSTAMP:' + fmtICSDate(new Date()),
      'DTSTART:' + fmtICSDate(start),
      'DTEND:' + fmtICSDate(end),
      'SUMMARY:' + icsEscape(title),
      'DESCRIPTION:' + icsEscape(details),
      'LOCATION:' + icsEscape(location)
    ];
    if(reminderMinutes){
      lines.push(
        'BEGIN:VALARM',
        'ACTION:DISPLAY',
        'DESCRIPTION:Reminder',
        'TRIGGER:-PT' + reminderMinutes + 'M',
        'END:VALARM'
      );
    }
    lines.push('END:VEVENT', 'END:VCALENDAR');
    return lines.join('\r\n');
  }
  function downloadICS(filename, cal){
    const blob = new Blob([buildICS(cal)], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Cairo is UTC+2 year-round (no DST) — times below given in UTC directly. Unchanged from the backend.
  const YEAR = 2026;
  const churchStart = new Date(Date.UTC(YEAR,9,24,13,30)); // 15:30 Cairo
  const churchEnd   = new Date(Date.UTC(YEAR,9,24,15,30));
  const recStart    = new Date(Date.UTC(YEAR,9,24,15,30)); // 17:30 Cairo
  const recEnd      = new Date(Date.UTC(YEAR,9,24,20,30)); // 22:30 Cairo

  const LIVESTREAM_URL = "https://www.youtube.com/watch?v=KPPSCLWU6KE";

  const churchCal = {
    title:"Nancy & Marc's Wedding Ceremony",
    details:"Ceremony at St. Mark Coptic Orthodox Church, Cleopatra, Heliopolis.\nCan't join in person? Watch live: " + LIVESTREAM_URL,
    location:"St. Mark Coptic Orthodox Church, Cleopatra, Heliopolis, Cairo",
    start:churchStart, end:churchEnd,
    reminderMinutes: 15
  };
  const receptionCal = {
    title:"Nancy & Marc's Wedding Reception",
    details:"Reception at The Garden, located inside Hilton Cairo Heliopolis.",
    location:"The Garden at Hilton Cairo Heliopolis, Cairo",
    start:recStart, end:recEnd,
    reminderMinutes: 15
  };

  document.getElementById('calChurchLink').addEventListener('click', () => downloadICS('ceremony.ics', churchCal));
  document.getElementById('calReceptionLink').addEventListener('click', () => downloadICS('reception.ics', receptionCal));

  /* ---------------- live countdown (target unchanged: ceremony start) ---------------- */
  const TARGET = churchStart.getTime();
  const slots = {};
  ["d0","d1","h0","h1","m0","m1","s0","s1"].forEach(function (key) {
    slots[key] = document.querySelector('.cd-tile[data-slot="' + key + '"]');
  });
  const announce = document.getElementById("countdownAnnounce");
  let lastAnnounceMinute = null;

  function setTile(el, digit) {
    const span = el.querySelector("span");
    if (span.textContent !== digit) {
      span.textContent = digit;
      el.classList.remove("flip");
      void el.offsetWidth;
      el.classList.add("flip");
    }
  }

  function tickCountdown() {
    const diff = Math.max(0, TARGET - Date.now());
    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const dd = String(Math.min(days, 99)).padStart(2, "0");
    const hh = String(hours).padStart(2, "0");
    const mm = String(minutes).padStart(2, "0");
    const ss = String(seconds).padStart(2, "0");

    setTile(slots.d0, dd[0]); setTile(slots.d1, dd[1]);
    setTile(slots.h0, hh[0]); setTile(slots.h1, hh[1]);
    setTile(slots.m0, mm[0]); setTile(slots.m1, mm[1]);
    setTile(slots.s0, ss[0]); setTile(slots.s1, ss[1]);

    if (minutes !== lastAnnounceMinute) {
      lastAnnounceMinute = minutes;
      announce.textContent = days + " days, " + hours + " hours and " + minutes + " minutes to go.";
    }
  }
  tickCountdown();
  setInterval(tickCountdown, 1000);

  /* ---------------- toast ---------------- */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 4200);
  }

  /* ---------------- RSVP form (same data shape + Firestore logic as the existing backend) ---------------- */
  const form = document.getElementById("rsvpForm");
  const submitBtn = document.getElementById("submitBtn");

  async function safeGet(key){
    try{ return await window.storage.get(key, true); }
    catch(_){ return null; }
  }

  function renderQR(containerId, data){
    const box = document.getElementById(containerId);
    box.innerHTML = '';
    if(data.attending !== 'yes'){ return; }
    if(data.tableNumber){
      const wrap = document.createElement('div');
      wrap.id = 'qr-canvas-wrap-' + containerId;
      box.appendChild(wrap);
      new QRCode(wrap, {
        text:`Nancy & Marc Wedding\n${data.name}\nTable ${data.tableNumber}`,
        width:160, height:160,
        colorDark:"#33163F", colorLight:"#FFFFFF"
      });
      const lbl = document.createElement('div');
      lbl.className = 'table-label';
      lbl.textContent = `Table ${data.tableNumber}`;
      box.appendChild(lbl);
    } else {
      const lbl = document.createElement('div');
      lbl.className = 'table-label';
      lbl.textContent = 'Your table number will appear here once seating is finalized — just revisit this page.';
      box.appendChild(lbl);
    }
  }

  const confirmBackdrop = document.getElementById('confirmBackdrop');
  document.getElementById('confirmClose').addEventListener('click', function(){
    confirmBackdrop.classList.remove('show');
  });

  function showConfirm(data){
    document.getElementById('confirmName').textContent = ', ' + data.name.split(' ')[0];
    if(data.attending === 'yes'){
      document.getElementById('confirmMsg').textContent = data.plusOne === 'yes'
        ? `We can't wait to celebrate with you and ${data.plusOneName || 'your guest'}.`
        : `We can't wait to celebrate with you.`;
    } else {
      document.getElementById('confirmMsg').textContent = `You'll be missed — thank you for letting us know.`;
    }
    const calWrap = document.getElementById('confirmCal');
    calWrap.innerHTML = '';
    if(data.attending === 'yes'){
      calWrap.innerHTML = `
        <button type="button" class="cal-pill" id="confirmCalChurch">+ Ceremony</button>
        <button type="button" class="cal-pill" id="confirmCalReception">+ Reception</button>
      `;
      document.getElementById('confirmCalChurch').addEventListener('click', () => downloadICS('ceremony.ics', churchCal));
      document.getElementById('confirmCalReception').addEventListener('click', () => downloadICS('reception.ics', receptionCal));
    }
    renderQR('qrBox', data);
    confirmBackdrop.classList.add('show');
  }

  // Silently restore + re-check a prior RSVP on revisit, so a since-assigned
  // table QR "just appears" without a manual lookup step.
  const REMEMBER_KEY = 'nancyMarcRsvpKey';
  (async function restore(){
    let savedKey = null;
    try { savedKey = localStorage.getItem(REMEMBER_KEY); } catch(e) {}
    if(!savedKey) return;
    const res = await safeGet(savedKey);
    if(!res) return;
    let data;
    try { data = JSON.parse(res.value); } catch(e) { return; }
    if(!data || typeof data.name !== 'string') return;

    document.getElementById('fullName').value = data.name;
    const attendRadio = form.querySelector(`input[name="attending"][value="${data.attending === 'yes' ? 'yes' : 'no'}"]`);
    if(attendRadio) attendRadio.checked = true;
    if(data.attending === 'yes'){
      const guestRadio = form.querySelector(`input[name="plusOne"][value="${data.plusOne === 'yes' ? 'yes' : 'no'}"]`);
      if(guestRadio) guestRadio.checked = true;
      if(data.plusOneName) document.getElementById('guestName').value = data.plusOneName;
    }
    showConfirm(data);
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('fullName').value.trim();
    const attendingChoice = (form.querySelector('input[name="attending"]:checked') || {}).value;
    const plusOneChoice = (form.querySelector('input[name="plusOne"]:checked') || {}).value || 'no';
    const guestName = document.getElementById('guestName').value.trim();

    if(!name){
      showToast('Please enter your full name.');
      document.getElementById('fullName').focus();
      return;
    }
    if(!attendingChoice){
      showToast("Please let us know if you'll attend.");
      return;
    }
    const isAttending = attendingChoice === 'yes';
    if(isAttending && plusOneChoice === 'yes' && !guestName){
      showToast("Please enter your guest's name.");
      document.getElementById('guestName').focus();
      return;
    }

    const key = 'rsvp:' + slugify(name);

    submitBtn.disabled = true;
    let existing = null;
    try { existing = await safeGet(key); } catch(_) {}

    if(existing){
      const proceed = window.confirm(
        `It looks like ${name} already RSVP'd. Submitting again will update that existing response. Continue?`
      );
      if(!proceed){
        submitBtn.disabled = false;
        showToast('RSVP not changed.');
        return;
      }
    }

    const data = {
      name,
      attending: isAttending ? 'yes' : 'no',
      plusOne: isAttending ? plusOneChoice : 'no',
      plusOneName: (isAttending && plusOneChoice === 'yes') ? guestName : '',
      tableNumber: null,
      submittedAt: new Date().toLocaleString('en-GB', { timeZone:'Africa/Cairo', dateStyle:'medium', timeStyle:'medium' }) + ' (Cairo)',
      submittedAtMs: Date.now()
    };

    try {
      if(existing){
        try { const prev = JSON.parse(existing.value); data.tableNumber = prev.tableNumber || null; } catch(_) {}
      }
      const result = await window.storage.set(key, JSON.stringify(data), true);
      if(!result){ throw new Error('save failed'); }
      try { localStorage.setItem(REMEMBER_KEY, key); } catch(e) {}
      showConfirm(data);
    } catch(err) {
      console.error(err);
      showToast("Couldn't send — please try again.");
    } finally {
      submitBtn.disabled = false;
    }
  });

  /* ---------------- admin (unchanged behaviour from the existing backend) ---------------- */
  let tapCount = 0, tapTimer = null;
  document.getElementById('admin-trigger').addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 2500);
    if(tapCount >= 5){
      tapCount = 0;
      const pass = prompt('Admin passcode:');
      if(pass === 'MN2026'){ openAdmin(); }
    }
  });
  document.getElementById('admin-close').addEventListener('click', () => {
    document.getElementById('admin-overlay').classList.remove('show');
  });

  async function openAdmin(){
    const overlay = document.getElementById('admin-overlay');
    overlay.classList.add('show');
    const summaryEl = document.getElementById('admin-summary');
    const tableWrap = document.getElementById('admin-table-wrap');
    summaryEl.innerHTML = '<span class="admin-loading">Loading responses…</span>';
    tableWrap.innerHTML = '';
    try {
      const list = await window.storage.list('rsvp:', true);
      const keys = (list && list.keys) || [];
      const entries = [];
      for(const k of keys){
        try {
          const r = await window.storage.get(k, true);
          if(r){
            const parsed = JSON.parse(r.value);
            if(parsed && typeof parsed.name === 'string') entries.push({key:k, data:parsed});
          }
        } catch(_) {}
      }
      entries.sort((a,b) => a.data.name.localeCompare(b.data.name));

      const attendingCount = entries.filter(e => e.data.attending === 'yes').length;
      const plusOnes = entries.filter(e => e.data.attending === 'yes' && e.data.plusOne === 'yes').length;
      const declined = entries.filter(e => e.data.attending === 'no').length;
      const totalGuests = attendingCount + plusOnes;

      summaryEl.innerHTML = `
        <div><b>${entries.length}</b>Responses</div>
        <div><b>${attendingCount}</b>Attending</div>
        <div><b>${totalGuests}</b>Total Guests</div>
        <div><b>${declined}</b>Declined</div>
      `;

      if(entries.length === 0){
        tableWrap.innerHTML = '<div class="admin-loading">No RSVPs yet.</div>';
        return;
      }

      const tbl = document.createElement('table');
      tbl.className = 'guest-table';
      tbl.innerHTML = `<thead><tr><th>Name</th><th>Status</th><th>+1</th><th>Table</th><th></th></tr></thead><tbody></tbody>`;
      const tbody = tbl.querySelector('tbody');

      entries.forEach(({key, data}) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${data.name}</td>
          <td>${data.attending === 'yes' ? 'Yes' : 'No'}</td>
          <td>${data.plusOne === 'yes' ? (data.plusOneName || 'Yes') : '—'}</td>
          <td><input type="number" min="1" value="${data.tableNumber || ''}" ${data.attending !== 'yes' ? 'disabled' : ''}></td>
          <td><button class="save-row" ${data.attending !== 'yes' ? 'disabled' : ''}>Save</button></td>
        `;
        const input = tr.querySelector('input');
        const saveBtn = tr.querySelector('.save-row');
        saveBtn.addEventListener('click', async () => {
          const val = parseInt(input.value, 10);
          data.tableNumber = val || null;
          saveBtn.textContent = 'Saving…';
          try {
            await window.storage.set(key, JSON.stringify(data), true);
            saveBtn.textContent = 'Saved ✓';
            setTimeout(() => { saveBtn.textContent = 'Save'; }, 1500);
          } catch(_) {
            saveBtn.textContent = 'Error';
          }
        });
        tbody.appendChild(tr);
      });
      tableWrap.appendChild(tbl);
    } catch(err) {
      summaryEl.innerHTML = '<span class="admin-loading">Could not load responses.</span>';
      console.error(err);
    }
  }
})();
</script>
</body>
</html>
